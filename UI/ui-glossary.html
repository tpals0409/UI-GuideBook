<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI GuideBook</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/fav-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/fav-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/touch-180.png">
<meta name="theme-color" content="#f2f2f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#f2f2f2;--ui-surface:#fff;--ui-surface-2:#f7f7f7;--ui-text:#141414;--ui-muted:#666;--ui-line:#dadada;--ui-accent:#141414;--ui-on-accent:#fff;--ui-soft:#ebebeb;
  --ui-shadow:0 1px 2px rgb(0 0 0/.05),0 4px 12px rgb(0 0 0/.07);--stage:#f7f7f7;--grid:#d2d2d2;--tick:#9e9e9e;
  --bg:#f2f2f2;--surface:#fff;--surface-2:#f2f4f7;--text:#192132;--muted:#5a6477;--border:#d7dce3;
  --primary:#2e4fd8;--on-primary:#fff;--primary-soft:#e2e8fc;--danger:#cf2e21;--success:#12804a;--warn:#b26d00;
  --shadow:0 1px 2px rgb(16 24 40/.06),0 4px 12px rgb(16 24 40/.08);--hl:rgb(255 255 255/.9);--sd:rgb(16 24 40/.14);
  color-scheme:light;
}
@font-face{font-family:'Gmarket Sans';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansMedium.woff2') format('woff2'),url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'Gmarket Sans';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansBold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSansBold.woff') format('woff')}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:84px}
body{margin:0;background:var(--ui-bg);color:var(--ui-text);font:15px/1.65 "Gmarket Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
kbd{font:12px/1 "IBM Plex Mono",ui-monospace,monospace;border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;color:var(--ui-muted);background:var(--ui-surface)}

/* 뼈대: 왼쪽 사이드바 + 본문 */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--ui-line);padding:24px 14px 18px;display:flex;flex-direction:column;gap:26px;background:var(--ui-bg);z-index:30}
.brand{padding:0 8px}
.brand b{display:block;font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.brand p{margin:6px 0 0;font-size:13px;color:var(--ui-muted);line-height:1.55}
.nav-h{margin:0 0 6px;padding:0 8px;font-size:12.5px;font-weight:600;color:var(--ui-muted)}
.cats{display:flex;flex-direction:column;gap:1px}
.cats button{all:unset;box-sizing:border-box;position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px 7px 14px;border-radius:8px;font-size:14px;color:var(--ui-text);cursor:pointer}
.cats button .n{font-size:12px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
.cats button:hover{background:color-mix(in srgb,var(--ui-text) 6%,transparent)}
.cats button[aria-pressed=true]{background:var(--ui-surface);font-weight:600;box-shadow:inset 0 0 0 1px var(--ui-line)}
.cats button[aria-pressed=true]::before,.cats button.here::before{content:'';position:absolute;left:4px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--ui-accent)}
.cats button.here:not([aria-pressed=true])::before{background:color-mix(in srgb,var(--ui-accent) 45%,transparent)}
.cats button:focus-visible,.docs a:focus-visible{outline:2px solid var(--ui-accent);outline-offset:-2px}
.docs a{display:block;padding:7px 10px 7px 14px;border-radius:8px;font-size:13.5px;line-height:1.45;text-decoration:none}
.docs a:hover{background:color-mix(in srgb,var(--ui-text) 6%,transparent)}
.legend{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--ui-line);display:flex;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--ui-muted)}
.legend p{margin:0;width:100%;line-height:1.55}
.legend p:first-child{font-weight:600;margin-bottom:2px}
.legend p:last-child{margin-top:6px}

.mainc{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ui-line)}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:10px;height:44px;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:12px;padding:0 10px 0 14px;color:var(--ui-muted);min-width:0}
.search:focus-within{border-color:var(--ui-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 18%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ui-text);font:inherit;font-size:15px;outline:none!important}
.tool-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);cursor:pointer;display:inline-grid;place-items:center;font-size:17px}
.tool-btn:hover{border-color:color-mix(in srgb,var(--ui-text) 30%,var(--ui-line))}
.menu-btn{display:none}
.nav-scrim{position:fixed;inset:0;background:rgb(10 14 24/.45);z-index:29}

main{padding:4px 28px 64px;max-width:1480px;width:100%}
.cat{scroll-margin-top:84px}
.cat-head{margin:40px 0 18px;max-width:68ch}
.cat-head h2{margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.cat-head h2 .n{font-size:15px;font-weight:500;letter-spacing:0;color:var(--ui-muted)}
.cat-head p{margin:6px 0 0;font-size:15px;color:var(--ui-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}

/* 타일: 위는 부품을 올려 두는 무대, 아래는 이름표 */
.card{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:0;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--ui-text) 26%,var(--ui-line))}
.card:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.card .demo{cursor:pointer;min-height:224px}
/* 타일 자동 재생: 가짜 커서와 누르는 표시 */
.card .demo *,.card .demo *::before,.card .demo *::after{animation-play-state:paused}
.card:hover .demo *,.card:hover .demo *::before,.card:hover .demo *::after,.card:focus-visible .demo *,.card:focus-visible .demo *::before,.card:focus-visible .demo *::after{animation-play-state:running}
.play-cursor{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgb(20 20 20/.22);box-shadow:0 0 0 2px rgb(255 255 255/.9),0 1px 4px rgb(0 0 0/.3);pointer-events:none;z-index:20;opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .2s}
.play-cursor.on{opacity:1}
.play-cursor.tap::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgb(20 20 20/.35);animation:tap .45s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.lift.is-hover{transform:translateY(-6px);box-shadow:0 14px 26px rgb(0 0 0/.16)}
.lift.scale.is-hover{transform:scale(1.06)}
.tt.is-hover [role=tooltip]{opacity:1;transform:translateX(-50%)}
.cap{padding:12px 10px 8px;display:flex;flex-direction:column;gap:3px}
.cap h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.005em;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
.cap h3 .ko{font-size:13px;font-weight:400;color:var(--ui-muted)}
.cap p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ui-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-msg{margin:0;padding:80px 28px;color:var(--ui-muted)}
/* 모션: prompt-motion의 모션 영상과 프롬프트 (사이드바 "참고 → 모션") */
body[data-view]:not([data-view=terms]) :is(#app,#empty,#ai,#ai-panel){display:none!important}
/* 애니메이션 코드 모음 (Tween UI): 글자 카드 + 코드 보기 */
/* 애니메이션 타일: 용어 타일과 같은 모양 (무대 + 이름표). 무대 안은 같은 주소의 미리보기 iframe */
.an-tile{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:0;cursor:pointer;transition:border-color .15s}
.an-tile:hover{border-color:color-mix(in srgb,var(--ui-text) 26%,var(--ui-line))}
.an-tile:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.an-tile .demo{min-height:224px}
.demo.an-stage{position:relative;overflow:hidden;padding:0;display:block}
.an-stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;opacity:0;transition:opacity .25s;background:transparent}
.an-stage iframe.on{opacity:1}
.dt .an-stage{height:min(56vh,520px);min-height:300px}
.an-src{display:flex;flex-direction:column;gap:10px}
.an-src dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.an-src dt{color:var(--ui-muted);white-space:nowrap}.an-src dd{margin:0}
.an-src pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--ui-surface-2);border:1px solid var(--ui-line);border-radius:10px;padding:12px;max-height:46vh;overflow:auto;color:var(--ui-text)}
.an-re{position:absolute;right:10px;bottom:10px;z-index:2;border:0;border-radius:999px;background:rgb(255 255 255/.92);color:#141414;font:inherit;font-size:12.5px;padding:6px 12px;cursor:pointer}
.mo-acts{display:flex;flex-wrap:wrap;gap:8px}
.mo-acts .mo-act.sub{background:var(--ui-surface);color:var(--ui-text);box-shadow:inset 0 0 0 1px var(--ui-line)}
.dt-tween .tw-list{display:flex;flex-wrap:wrap;gap:6px}
.dt-tween .tw-list button{border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);font:inherit;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer}
.dt-tween .tw-list button:hover{border-color:var(--ui-text)}
.docs a[aria-current=page]{background:var(--ui-surface);font-weight:600;box-shadow:inset 0 0 0 1px var(--ui-line)}
.mo{padding:4px 28px 64px;max-width:1480px}
.mo-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.mo-chips button{border:1px solid var(--ui-line);background:var(--ui-surface);color:var(--ui-text);font:inherit;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.mo-chips button[aria-pressed=true]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-on-accent)}
.mo-chips .n{opacity:.6;margin-left:4px;font-size:12px}
.mo-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:14px;overflow:hidden}
.mo-card:hover{border-color:color-mix(in srgb,var(--ui-text) 35%,var(--ui-line))}
.mo-card:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.mo-th{position:relative;aspect-ratio:16/9;background:var(--ui-soft)}
.mo-th img,.mo-th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mo-meta{padding:12px 14px 14px}
.mo-meta b{display:block;font-size:15px;line-height:1.4}
.mo-meta small{display:block;margin-top:4px;color:var(--ui-muted);font-size:12.5px}
.mo-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ui-soft);margin-right:6px}
.mo-dlg{width:min(1080px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:18px;background:var(--ui-surface);color:var(--ui-text);overflow:hidden;box-shadow:0 24px 80px rgb(0 0 0/.35)}
.mo-dlg::backdrop{background:rgb(10 14 24/.55)}
.mo-dt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);max-height:calc(100vh - 32px)}
.mo-dt video{width:100%;height:100%;max-height:calc(100vh - 32px);background:#000;object-fit:contain;display:block}
.mo-side{display:flex;flex-direction:column;gap:12px;padding:20px;overflow-y:auto;min-height:0}
.mo-side h2{margin:0;font-size:20px;line-height:1.35;padding-right:36px}
.mo-by{margin:0;font-size:13px;color:var(--ui-muted)}
.mo-by a{color:inherit}
.mo-side dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.mo-side dt{color:var(--ui-muted);white-space:nowrap}.mo-side dd{margin:0}
.mo-side pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--ui-surface-2);border:1px solid var(--ui-line);border-radius:10px;padding:12px;max-height:46vh;overflow-y:auto}
.mo-act{align-self:flex-start;border:0;border-radius:10px;background:var(--ui-accent);color:var(--ui-on-accent);font:inherit;padding:9px 14px;font-size:14px;cursor:pointer}
.mo-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgb(255 255 255/.9);cursor:pointer;display:grid;place-items:center;z-index:1}
@media (max-width:760px){.mo{padding:4px 16px 48px}.mo-dt{grid-template-columns:1fr}.mo-dt video{max-height:40vh}}
@media (prefers-reduced-motion:reduce){.mo-th video{display:none}}
html.mouse :focus{outline:none!important}

.aka{font-size:13px;color:var(--ui-muted)}
.srcs{display:flex;flex-wrap:wrap;gap:4px}
.src{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;text-decoration:none;border:1px solid transparent;line-height:1.5}
a.src:hover{text-decoration:underline}
.src-APG{background:#e2ecfb;color:#1c4a8a}.src-MDN{background:#e8e9ed;color:#1b1d24}.src-M3{background:#ece4fa;color:#57298c}
.src-HIG{background:#e4eaef;color:#2b3c48}.src-WCAG{background:#dcf2e4;color:#12603a}.src-DTCG{background:#fbecdb;color:#83460e}
.src-idiom{background:transparent;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.desc{margin:0;font-size:15px}
.diff{margin:0;font-size:14px;color:var(--ui-muted);border-top:1px solid var(--ui-line);padding-top:12px}
.diff b{color:var(--ui-text);font-weight:600;margin-right:6px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);height:auto;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:8px 0 30px rgb(0 0 0/.18)}
  .nav-open .side{transform:none}
  .menu-btn{display:inline-grid}
  .bar{padding:10px 16px;gap:8px}
  main{padding:0 16px 56px}
  .empty-msg{padding:60px 16px}
  .cat-head{margin:30px 0 14px}
  .cat-head h2{font-size:23px}
  .ai-l{display:none}
}

/* AI 검색 */
.ai-btn{flex:none;height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--ui-accent);color:var(--ui-on-accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.ai-btn:disabled{opacity:.6;cursor:wait}
.ai-panel{margin:16px 28px 0}
@media (max-width:900px){.ai-panel{margin:12px 16px 0}}
.ai-box{background:var(--ui-surface);border:1px solid color-mix(in srgb,var(--ui-accent) 35%,var(--ui-line));border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.ai-head .icon-btn{width:32px;height:32px}
.ai-ans{margin:0;font-size:15px}
.ai-res{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}
.ai-res button{all:unset;box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-surface-2);cursor:pointer;font-size:13px}
.ai-res button:hover{border-color:var(--ui-accent)}
.ai-res button:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ai-res b{font-size:14px}
.ai-res .pill{align-self:flex-start}
.ai-note,.ai-load{margin:0;font-size:12px;color:var(--ui-muted);display:flex;align-items:center;gap:8px}
.ai-err{margin:0;font-size:14px;color:var(--danger)}

/* 상세 모달 */
html:has(.dt[open]){overflow:hidden}
/* 모든 용어에서 같은 크기: 내용이 넘치면 본문만 스크롤 */
.dt{border:0;padding:0;width:min(1040px,calc(100% - 32px));height:min(88vh,860px);max-width:none;max-height:none;border-radius:20px;background:var(--ui-surface);color:var(--ui-text);box-shadow:0 24px 80px rgb(0 0 0/.35);overflow:hidden}
.dt[open]{display:flex;flex-direction:column;animation:dtIn .24s cubic-bezier(.2,.8,.2,1)}
.dt::backdrop{background:rgb(8 10 18/.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s ease-out}
@keyframes dtIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}}
.dt-head{display:flex;align-items:flex-start;gap:12px;padding:18px 16px 12px 22px;border-bottom:1px solid var(--ui-line)}
.dt-head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dt-head h2{margin:0;font-size:22px;letter-spacing:-.02em}
.dt-head .ko{font-size:14px;color:var(--ui-muted);font-weight:500;margin-left:6px}
.dt-body{flex:1;min-height:0;padding:16px 22px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dt-body .desc{font-size:15px}
.dt .dt-demo{min-height:340px;padding:32px 24px}
.dt-how h3,.dt-demo-l{font-size:13px;margin:0 0 8px;color:var(--ui-muted);font-weight:600}
.dt-how ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.dt-how li{counter-increment:s;display:flex;gap:10px;font-size:14px;align-items:flex-start}
.dt-how li::before{content:counter(s);flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;background:var(--ui-soft);color:var(--ui-accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.dt-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--ui-line);font-size:12px;color:var(--ui-muted)}
@media (max-width:640px){.dt{width:100%;height:92vh;margin:auto 0 0;border-radius:20px 20px 0 0}.dt[open]{animation-name:dtUp}@keyframes dtUp{from{transform:translateY(40%);opacity:0}}}

/* 서비스 화면 안의 공용 부품은 예시 팔레트와 상관없이 모노톤 */
.dt-x,.ai-x{color:var(--ui-text)}
.dt-foot .btn.text{color:var(--ui-text)}
.dt-foot .btn.text:hover{background:var(--ui-soft)}
.ai-res .pill{background:var(--ui-soft);color:var(--ui-text)}
.ai-load .spin{border-color:var(--ui-line);border-top-color:var(--ui-text)}
.demo{color:var(--text);font-family:var(--demo-font,inherit)}

/* 예시 테마 패널 */
.bar{position:sticky}
.theme-btn{width:auto;padding:0 14px;gap:7px;display:inline-flex;align-items:center;font:inherit;font-size:14px}
.theme-btn[aria-expanded=true]{border-color:var(--ui-text)}

.tp-act:hover,.dt-prompt:hover{border-color:color-mix(in srgb,var(--ui-text) 40%,var(--ui-line))}

.dt-theme{display:flex;flex-direction:column;gap:8px}
.dt-theme h3{font-size:13px;margin:0;color:var(--ui-muted);font-weight:700}

/* 데모 공통 */
.demo{position:relative;background-color:var(--stage);background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:14px 14px;background-position:7px 7px;border-radius:10px;padding:22px 18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px}
.demo::after{content:'';position:absolute;inset:8px;pointer-events:none;background:
  linear-gradient(var(--tick),var(--tick)) left top/9px 1px no-repeat,linear-gradient(var(--tick),var(--tick)) left top/1px 9px no-repeat,
  linear-gradient(var(--tick),var(--tick)) right top/9px 1px no-repeat,linear-gradient(var(--tick),var(--tick)) right top/1px 9px no-repeat,

.muted{color:var(--muted)}

.btn{font:inherit;font-size:14px;font-weight:600;border-radius:var(--r-btn,999px);padding:9px 18px;border:1px solid transparent;cursor:pointer;background:var(--primary);color:var(--on-primary);transition:filter .15s,box-shadow .15s,transform .1s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.tonal{background:var(--primary-soft);color:var(--primary)}
.btn.outline{background:transparent;color:var(--primary);border-color:var(--border)}
.btn.text{background:transparent;color:var(--primary)}
.btn.text:hover{background:var(--primary-soft);filter:none}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--text);cursor:pointer;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.icon-btn[aria-pressed=true]{color:var(--danger)}
.icon-btn[aria-pressed=true] svg{fill:currentColor}

.frame{position:relative;width:100%;height:160px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);padding:12px;overflow:hidden}
.frame.p0{padding:0}

.pill.no{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);box-shadow:var(--shadow);padding:6px;z-index:6;display:flex;flex-direction:column;text-align:left}
.menu [role=menuitem]{all:unset;padding:8px 10px;border-radius:var(--r-sm,6px);cursor:pointer;font-size:14px}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--surface-2)}
.ctls{display:flex;flex-direction:column;gap:6px;width:100%}
.ctl{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;font-size:12px;color:var(--muted);width:100%}
.ctl input[type=range]{width:100%}

.ctl select{grid-column:2/4;padding:5px 8px}
.code-out{display:block;white-space:pre-wrap;font:12px/1.55 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);padding:8px 10px;border-radius:var(--r-md,8px);border:1px solid var(--border);width:100%;color:var(--text)}

const P={

  bell:'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 21h4',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',

};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const FILL=['디자인 시스템은 반복되는 결정을 줄여 줘요.','같은 문제를 같은 방식으로 풀면 사용자는 덜 배워도 돼요.','컴포넌트는 모양뿐 아니라 상태와 규칙까지 포함한 약속이에요.','여백은 비어 있는 공간이 아니라 정보를 묶는 도구예요.','작은 일관성이 쌓여 제품에 대한 신뢰가 돼요.'];
const paras=n=>Array.from({length:n},(_,i)=>`<p>${FILL[i%5]} ${FILL[(i+2)%5]}</p>`).join('');
// 슬라이더·셀렉트 컨트롤: bind()가 값을 모아 fn에 넘겨요
const ctl=(k,label,min,max,v,u='')=>`<label class="ctl"><span>${label}</span><input type="range" data-k="${k}" data-u="${u}" min="${min}" max="${max}" value="${v}"><output>${v}${u}</output></label>`;
const sel=(k,label,opts)=>`<label class="ctl"><span>${label}</span><select data-k="${k}">${opts.map(o=>`<option>${o}</option>`).join('')}</select></label>`;
function bind(el,fn){
  const ins=$$('.ctl [data-k]',el);
  const run=()=>{const v={};ins.forEach(i=>{v[i.dataset.k]=i.type==='range'?+i.value:i.value;const o=i.nextElementSibling;if(o?.tagName==='OUTPUT')o.textContent=i.value+(i.dataset.u||'')});fn(v)};
  ins.forEach(i=>i.addEventListener('input',run));run();
}
function menuToggle(btn,menu){
  const set=o=>{menu.hidden=!o;btn.setAttribute('aria-expanded',o)};
  btn.addEventListener('click',e=>{e.stopPropagation();const o=menu.hidden;set(o);if(o)$('[role=menuitem]',menu)?.focus()});
  document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))set(false)});
  menu.addEventListener('click',e=>{if(e.target.closest('[role=menuitem]'))set(false)});
  menu.addEventListener('keydown',e=>{
    const it=$$('[role=menuitem]',menu),i=it.indexOf(document.activeElement);
    if(e.key==='Escape'){set(false);btn.focus()}
    if(e.key==='ArrowDown'){e.preventDefault();it[(i+1)%it.length].focus()}
    if(e.key==='ArrowUp'){e.preventDefault();it[(i-1+it.length)%it.length].focus()}
  });
}

// 버튼을 누르면 CSS 애니메이션(.play)을 처음부터 다시 재생해요. 모달에서는 열자마자 한 번 재생해요
// 애니메이션 미리보기(같은 주소의 iframe)에 예시 테마의 색·글꼴을 넣어요. 테마를 바꾸면 applyTheme이 다시 불러요
function themeFrame(fr){
  try{
    const d=fr.contentDocument;if(!d?.documentElement||!window.themeVars)return;
    const{vars,css}=window.themeVars();
    for(const[k,v]of Object.entries(vars))d.documentElement.style.setProperty(k,v);
    if(css&&!d.querySelector(`link[href="${css}"]`))d.head.insertAdjacentHTML('beforeend',`<link rel="stylesheet" href="${css}">`);
  }catch{}
}
const replay=(n,btn,el)=>{const go=()=>{n.classList.remove('play');void n.offsetWidth;n.classList.add('play')};btn.onclick=go;if(!el.closest('.card'))go()};
addEventListener('pointerdown',e=>{if(e.isTrusted)document.documentElement.classList.add('mouse')},true);

{id:'checkbox',en:'Checkbox',ko:'체크박스',src:'APG:checkbox MDN:Web/HTML/Element/input/checkbox',
 desc:'여러 항목 중 원하는 만큼 고를 때 쓰는 네모 칸이에요. 약관 동의 화면이 대표적이에요. 하위 항목 중 일부만 선택되면 상위 항목에 "–" 표시(indeterminate)가 나와요.',
 demo:`<div class="col"><label class="ck"><input type="checkbox" class="all"> <b>전체 동의</b></label><div class="col indent"><label class="ck"><input type="checkbox" class="it" checked> 이용약관 (필수)</label><label class="ck"><input type="checkbox" class="it"> 개인정보 수집 (필수)</label><label class="ck"><input type="checkbox" class="it"> 마케팅 수신 (선택)</label></div></div>`,
 init(el){const all=$('.all',el),its=$$('.it',el);const sync=()=>{const n=its.filter(i=>i.checked).length;all.checked=n===its.length;all.indeterminate=n>0&&n<its.length};all.onchange=()=>{its.forEach(i=>i.checked=all.checked);sync()};its.forEach(i=>i.onchange=sync);sync()}},
{id:'radio',en:'Radio group',ko:'라디오 버튼',src:'APG:radio M3:radio-button',
 desc:'여러 선택지 중 하나만 고를 때 쓰는 동그란 버튼이에요. 하나를 고르면 나머지는 자동으로 해제돼요.',
 diff:'선택지가 많아(대략 7개 이상) 화면을 많이 차지하면 Select로 바꿔요.',
 demo:`<fieldset class="col"><legend>배송 방법</legend><label class="ck"><input type="radio" name="ship" checked> 일반 배송 (무료)</label><label class="ck"><input type="radio" name="ship"> 빠른 배송 (+3,000원)</label><label class="ck"><input type="radio" name="ship"> 매장 픽업</label></fieldset>`},
{id:'select',en:'Select',ko:'셀렉트·드롭다운',aka:'Dropdown · Picker (Apple) · Listbox',src:'MDN:Web/HTML/Element/select APG:listbox M3:menus HIG:pickers',
 desc:'누르면 목록이 펼쳐지고 그중 하나를 고르는 입력이에요. 지역, 국가 선택에 많이 써요. HTML 기본 &lt;select&gt;를 쓰면 휴대폰에서는 휴대폰 자체 선택 화면이 떠요.',
 diff:'"드롭다운"은 펼쳐지는 UI를 모두 부르는 말이에요. 값을 고르면 Select, 동작을 실행하면 Menu라고 구분해요.',
 demo:`<label class="tf" style="max-width:240px">지역<select><option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option></select></label>`},
{id:'combobox',en:'Combobox',ko:'콤보박스·자동완성',aka:'Autocomplete · Typeahead',src:'APG:combobox MDN:Web/HTML/Element/datalist',
 desc:'입력칸과 추천 목록을 합친 것이에요. 글자를 칠수록 후보가 줄어들어요. 검색창 자동완성이 대표적이에요.',
 diff:'Select는 목록 안에서만 고를 수 있고, Combobox는 목록에 없는 값도 직접 입력할 수 있어요.',
 demo:`<div class="cb"><input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="과일" placeholder="과일 검색 (예: 블)"><ul role="listbox" class="cb-list" hidden></ul></div><p class="muted sm out">&nbsp;</p>`,
 init(el){const inp=$('input',el),ul=$('ul',el),out=$('.out',el),all=['사과','배','포도','복숭아','수박','참외','딸기','바나나','블루베리','블랙베리','망고','자두'];let act=-1,list=[];
  const close=()=>{ul.hidden=true;inp.setAttribute('aria-expanded',false);act=-1};
  const draw=()=>{const q=inp.value.trim();list=all.filter(f=>f.includes(q));if(!q||!list.length)return close();
   ul.innerHTML=list.map((f,i)=>`<li role="option" aria-selected="${i===act}">${f.replace(q,`<mark>${q}</mark>`)}</li>`).join('');ul.hidden=false;inp.setAttribute('aria-expanded',true)};
  const pick=f=>{inp.value=f;out.textContent=`선택: ${f}`;close()};
  inp.oninput=()=>{act=-1;draw()};
  inp.onkeydown=e=>{if(ul.hidden)return;if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%list.length;draw()}if(e.key==='ArrowUp'){e.preventDefault();act=(act-1+list.length)%list.length;draw()}if(e.key==='Enter'&&act>=0)pick(list[act]);if(e.key==='Escape')close()};
  ul.onmousedown=e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.textContent)}};
  inp.onblur=close}},
{id:'multi-select',en:'Multi-select listbox',ko:'멀티 셀렉트',src:'APG:listbox',
 desc:'목록에서 여러 개를 동시에 고르는 입력이에요. "관심 분야를 모두 고르세요"처럼 답이 여러 개인 질문에 써요.',
 diff:'선택지가 적으면 체크박스 목록이 더 간단해요. 선택지가 많으면 검색 입력칸과, 고른 항목을 칩(Chip)으로 보여주는 방식을 써요.',
 demo:`<div class="ms" role="listbox" aria-multiselectable="true" aria-label="관심 분야">${['디자인','프론트엔드','백엔드','데이터','인프라','기획'].map((t,i)=>`<div role="option" tabindex="0" aria-selected="${i===1}">${t}</div>`).join('')}</div><p class="muted sm out"></p>`,
 init(el){const out=$('.out',el),ops=$$('[role=option]',el);const upd=()=>{const s=ops.filter(o=>o.getAttribute('aria-selected')==='true').map(o=>o.textContent);out.textContent='선택: '+(s.join(', ')||'없음')};
  ops.forEach(o=>{const t=()=>{o.setAttribute('aria-selected',o.getAttribute('aria-selected')!=='true');upd()};o.onclick=t;o.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t()}}});upd()}},
{id:'slider',en:'Slider',ko:'슬라이더',src:'APG:slider M3:sliders HIG:sliders MDN:Web/HTML/Element/input/range',
 desc:'막대 위 손잡이를 끌어서 값을 고르는 입력이에요. 볼륨, 밝기처럼 대략적인 값을 고를 때 써요.',
 diff:'정확한 숫자가 필요하면 숫자 입력칸을 함께 둬요. 국내에서 "슬라이더"라고 부르는 배너 넘김 UI의 공식 이름은 Carousel이에요.',
 demo:`<div class="col full"><div class="between"><span>볼륨</span><output>40</output></div><input type="range" min="0" max="100" value="40" aria-label="볼륨" style="width:100%"></div>`,
 init(el){const i=$('input',el),o=$('output',el);i.oninput=()=>o.textContent=i.value}},
{id:'range-slider',en:'Multi-thumb slider',ko:'레인지 슬라이더',aka:'Range slider · Dual slider',src:'APG:slider-multithumb M3:sliders',
 desc:'손잡이 두 개로 최솟값과 최댓값을 정하는 슬라이더예요. 쇼핑몰 가격 필터가 대표적이에요.',
 demo:`<div class="col full"><div class="between"><span>가격</span><span class="v"></span></div><div class="rs"><div class="rs-track"><div class="rs-fill"></div></div><input type="range" min="0" max="100" value="20" aria-label="최소 가격"><input type="range" min="0" max="100" value="70" aria-label="최대 가격"></div></div>`,
 init(el){const [a,b]=$$('input',el),f=$('.rs-fill',el),v=$('.v',el);const upd=e=>{let lo=+a.value,hi=+b.value;if(hi-lo<5){if(e?.target===a)a.value=lo=hi-5;else b.value=hi=lo+5}f.style.left=lo+'%';f.style.width=(hi-lo)+'%';v.textContent=`${lo}만 ~ ${hi}만 원`};a.oninput=b.oninput=upd;upd()}},
{id:'text-field',en:'Text field',ko:'텍스트 필드',aka:'Input · Text input',src:'M3:text-fields HIG:text-fields MDN:Web/HTML/Element/input',
 desc:'한 줄짜리 글자를 입력하는 칸이에요. 위에는 무엇을 입력할지 알려주는 라벨, 아래에는 도움말이 붙어요.',
 diff:'Material 3는 배경이 채워진 Filled와 테두리만 있는 Outlined 두 모양을 정의해요. 기능은 같아요.',
 demo:`<div class="col full"><label class="tf filled">이름 (Filled)<input value="김개발"></label><label class="tf">이메일 (Outlined)<input type="email" placeholder="name@example.com"><small>회사 이메일을 입력해 주세요</small></label></div>`},
{id:'textarea',en:'Textarea',ko:'텍스트 영역',aka:'Multi-line text field',src:'MDN:Web/HTML/Element/textarea',
 desc:'여러 줄을 입력하는 칸이에요. 메모, 문의 내용처럼 긴 글을 받을 때 써요. 글자 수 제한이 있으면 입력한 글자 수를 보여줘요.',
 demo:`<label class="tf">메모<textarea maxlength="100" rows="3" placeholder="여러 줄 입력…"></textarea><small class="cnt" style="text-align:right">0 / 100</small></label>`,
 init(el){const t=$('textarea',el),c=$('.cnt',el);t.oninput=()=>c.textContent=`${t.value.length} / 100`}},
{id:'floating-label',en:'Floating label',ko:'플로팅 라벨',src:'M3:text-fields IDIOM',
 desc:'비어 있을 때는 라벨이 입력칸 안에 있다가, 입력을 시작하면 위로 작게 올라가는 방식이에요. 공간을 아끼면서 라벨도 계속 보여요.',
 diff:'라벨 없이 입력칸 속 회색 안내 문구(placeholder)만 쓰면, 입력하는 순간 문구가 사라져서 무엇을 입력하던 중인지 알 수 없어요.',
 demo:`<label class="fl"><input placeholder=" "><span>닉네임</span></label>`},
{id:'search',en:'Search field',ko:'검색창',aka:'Search bar · Search box',src:'M3:search HIG:search-fields MDN:Web/HTML/Element/input/search',
 desc:'검색어를 입력하는 칸이에요. 보통 돋보기 아이콘과, 입력한 값을 지우는 × 버튼이 함께 있어요.',
 diff:'Material 3에서는 검색창을 누르면 결과 화면(Search view)이 크게 펼쳐지는 방식도 정의해요.',
 demo:`<form class="sb" role="search" onsubmit="return false">${ic('search',18)}<input type="search" placeholder="검색" aria-label="검색"></form>`},
{id:'date-picker',en:'Date picker',ko:'날짜 선택기',aka:'Datepicker · Calendar · Time picker',src:'M3:date-pickers HIG:pickers MDN:Web/HTML/Element/input/date',
 desc:'달력에서 날짜를 고르는 입력이에요. 예약, 생일 입력에 써요. HTML 기본 입력(type="date")을 쓰면 휴대폰 자체 달력이 떠요.',
 demo:`<div class="row"><label class="tf" style="width:auto">체크인<input type="date"></label><label class="tf" style="width:auto">시간<input type="time" value="15:00"></label></div>`},
{id:'color-picker',en:'Color well',ko:'컬러 피커',aka:'Color picker · Color input',src:'HIG:color-wells MDN:Web/HTML/Element/input/color',
 desc:'색을 고르는 입력이에요. 현재 색이 칠해진 칸을 누르면 색 선택 창이 열려요.',
 diff:'Apple은 이 칸을 Color well이라고 불러요.',
 demo:`<div class="row"><input type="color" value="#4f46e5" aria-label="색 선택"><code class="hex">#4f46e5</code></div>`,
 init(el){const i=$('input',el),h=$('.hex',el);i.oninput=()=>h.textContent=i.value}},
{id:'file-upload',en:'File input · Drop zone',ko:'파일 업로드',aka:'Uploader · Dropzone',src:'MDN:Web/HTML/Element/input/file IDIOM',
 desc:'내 기기의 파일을 골라서 올리는 입력이에요. 파일을 끌어다 놓을 수 있는 넓은 영역을 Drop zone이라고 불러요.',
 diff:'공식 HTML 요소는 &lt;input type="file"&gt;이고, Drop zone은 업계에서 쓰는 이름이에요.',
 demo:`<label class="dz"><input type="file" multiple hidden>${ic('upload',24)}<b>파일을 끌어다 놓거나 클릭</b><span class="sm list">PNG, JPG · 최대 10MB</span></label>`,
 init(el){const dz=$('.dz',el),inp=$('input',el),l=$('.list',el);const show=fs=>{if(fs.length)l.textContent=[...fs].map(f=>f.name).join(', ')};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');show(e.dataTransfer.files)};inp.onchange=()=>show(inp.files)}},
{id:'chip',en:'Chip',ko:'칩',aka:'Tag · Pill',src:'M3:chips',
 desc:'짧은 글자를 작은 둥근 상자에 담은 요소예요. 검색 필터, 입력한 태그 표시에 써요. 눌러서 선택하거나 ×로 지울 수 있어요.',
 diff:'Badge는 상태를 보여주기만 하고 누를 수 없어요. Chip은 누르거나 지울 수 있어요.',
 demo:`<div class="col full"><span class="muted sm">Filter chip</span><div class="row l">${['한식','중식','일식','양식'].map((t,i)=>`<button class="chip" aria-pressed="${i<2}">${ic('check',14)}${t}</button>`).join('')}</div><span class="muted sm">Input chip</span><div class="row l">${['react','typescript','vite'].map(t=>`<span class="chip in">${t}<button aria-label="${t} 삭제">×</button></span>`).join('')}</div></div>`,
 init(el){el.onclick=e=>{const c=e.target.closest('button.chip');if(c)c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true');const x=e.target.closest('.chip.in button');if(x)x.parentElement.remove()}}},
{id:'segmented',en:'Segmented button',ko:'세그먼트 버튼',aka:'Segmented control (Apple)',src:'M3:segmented-buttons HIG:segmented-controls',
 desc:'2~5개 선택지를 한 줄로 붙인 버튼이에요. 일/주/월 전환처럼 하나를 골라 보기 방식을 바꿀 때 써요.',
 diff:'Tabs는 아래 내용 전체를 바꾸고, Segmented button은 같은 내용을 어떤 방식으로 볼지 바꿀 때 주로 써요.',
 demo:`<div class="seg" role="radiogroup" aria-label="기간">${['일','주','월','년'].map((t,i)=>`<button role="radio" aria-checked="${!i}">${t}</button>`).join('')}</div><p class="muted sm out">일간 보기</p>`,
 init(el){const bs=$$('[role=radio]',el),o=$('.out',el);bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-checked',x===b));o.textContent=b.textContent+'간 보기'})}},
{id:'spinbutton',en:'Spin button',ko:'수량 스테퍼',aka:'Stepper (Apple) · Quantity selector',src:'APG:spinbutton HIG:steppers',
 desc:'− / + 버튼으로 숫자를 하나씩 늘리고 줄이는 입력이에요. 장바구니 수량 조절이 대표적이에요.',
 diff:'"Stepper"는 수량 조절과 단계 표시를 둘 다 가리켜서 헷갈려요. 수량 조절은 Spin button이라고 부르는 게 정확해요.',
 demo:`<div class="qty" role="group" aria-label="수량"><button class="dec" aria-label="빼기">−</button><input role="spinbutton" inputmode="numeric" aria-label="수량" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" value="1"><button class="inc" aria-label="더하기">+</button></div><p class="muted sm">1~10개</p>`,
 init(el){const i=$('input',el),d=$('.dec',el),u=$('.inc',el);const set=v=>{v=Math.min(10,Math.max(1,v||1));i.value=v;i.setAttribute('aria-valuenow',v);d.disabled=v===1;u.disabled=v===10};
  d.onclick=()=>set(+i.value-1);u.onclick=()=>set(+i.value+1);i.onchange=()=>set(+i.value);i.onkeydown=e=>{if(e.key==='ArrowUp'){e.preventDefault();set(+i.value+1)}if(e.key==='ArrowDown'){e.preventDefault();set(+i.value-1)}};set(1)}},
{id:'rating',en:'Rating',ko:'별점',aka:'Star rating',src:'APG:radio/examples/radio-rating HIG:rating-indicators',
 desc:'별 개수로 점수를 매기거나 보여주는 요소예요. 상품 리뷰에서 써요.',
 diff:'입력용 별점은 "5개 중 하나 고르기"라서 라디오 버튼으로 만드는 게 접근성 표준이에요.',
 demo:`<div class="rate" role="radiogroup" aria-label="별점">${[1,2,3,4,5].map(i=>`<label><input type="radio" name="rate" value="${i}" ${i===3?'checked':''} aria-label="${i}점">${ic('star',28)}</label>`).join('')}</div><p class="muted sm out">3점</p>`,
 init(el){const ls=$$('label',el),o=$('.out',el);const paint=n=>ls.forEach((l,i)=>l.classList.toggle('on',i<n));const cur=()=>+($('input:checked',el)?.value||0);
  ls.forEach((l,i)=>{l.onmouseenter=()=>paint(i+1)});$('.rate',el).onmouseleave=()=>paint(cur());el.onchange=()=>{paint(cur());o.textContent=cur()+'점'};paint(cur())}},
{id:'otp',en:'One-time code input',ko:'인증번호(OTP) 입력',aka:'PIN input · Verification code',src:'MDN:Web/HTML/Attributes/autocomplete IDIOM',
 desc:'문자로 받은 인증번호를 칸마다 한 자리씩 입력하는 방식이에요. autocomplete="one-time-code"를 넣으면 휴대폰이 문자 속 번호를 자동으로 채워줘요.',
 diff:'겉으로만 칸을 나누고 실제로는 입력칸 하나로 받는 방식도 많이 써요. 붙여넣기와 화면 낭독기에서 더 잘 동작해요.',
 demo:`<div class="otp" role="group" aria-label="인증번호 6자리">${[1,2,3,4,5,6].map(i=>`<input inputmode="numeric" maxlength="1" ${i===1?'autocomplete="one-time-code"':''} aria-label="${i}번째 숫자">`).join('')}</div><p class="muted sm out">6자리를 입력하거나 붙여넣어 보세요</p>`,
 init(el){const is=$$('input',el),o=$('.out',el);const done=()=>{const v=is.map(i=>i.value).join('');o.textContent=v.length===6?`입력 완료: ${v}`:'6자리를 입력하거나 붙여넣어 보세요'};
  is.forEach((i,k)=>{i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(-1);if(i.value&&k<5)is[k+1].focus();done()};
   i.onkeydown=e=>{if(e.key==='Backspace'&&!i.value&&k)is[k-1].focus()};
   i.onpaste=e=>{e.preventDefault();const d=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);[...d].forEach((c,j)=>is[j].value=c);is[Math.min(d.length,5)].focus();done()}})}},
{id:'validation',en:'Inline validation',ko:'유효성 검사·에러 메시지',aka:'Form validation · Error message',src:'MDN:Web/HTML/Constraint_validation WCAG:error-identification',
 desc:'입력한 값이 규칙에 맞는지 확인하고, 틀리면 입력칸 바로 아래에 이유를 알려주는 것이에요. 보통 입력을 마치고 다음 칸으로 넘어갈 때 확인해요.',
 diff:'빨간 테두리만으로는 부족해요. 색을 구분하기 어려운 사람도 있으니 무엇이 틀렸는지 글로 알려줘요(WCAG 3.3.1).',
 demo:`<form class="col full" novalidate><label class="tf">이메일<input type="email" required placeholder="name@example.com"><small class="err" aria-live="polite"></small></label><button class="btn sm" style="align-self:flex-start">확인</button></form>`,
 init(el){const f=$('form',el),i=$('input',el),m=$('.err',el);const chk=()=>{const ok=i.checkValidity();i.setAttribute('aria-invalid',!ok);m.className='err'+(ok?' ok':'');m.textContent=ok?'사용할 수 있는 이메일이에요':i.validity.valueMissing?'이메일을 입력해 주세요':'이메일 형식이 아니에요 (예: name@example.com)';return ok};
  i.onblur=chk;i.oninput=()=>{if(i.getAttribute('aria-invalid'))chk()};f.onsubmit=e=>{e.preventDefault();if(!chk())i.focus()}}},
]);
</script>

<!-- ───── 오버레이·피드백 ───── -->
<style>
.dlg{border:0;border-radius:var(--r-lg,20px);padding:22px;max-width:340px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 12px 40px rgb(0 0 0/.3)}
.dlg[open]{animation:up .2s ease-out}
.dlg::backdrop{background:rgb(0 0 0/.42)}
.dlg h4{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 16px}
.scrim{position:absolute;inset:0;background:rgb(0 0 0/.35);opacity:0;pointer-events:none;transition:.25s;z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px 16px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -4px 20px rgb(0 0 0/.15);display:flex;flex-direction:column;gap:10px}
.handle{width:36px;height:4px;border-radius:var(--r-sm,2px);background:var(--border);margin:0 auto}
.drawer{position:absolute;top:0;bottom:0;left:0;z-index:3;width:70%;max-width:220px;background:var(--surface);padding:14px 10px;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:2px;box-shadow:4px 0 20px rgb(0 0 0/.15);font-size:14px}
.drawer b{padding:4px 12px 8px}
.drawer a{padding:8px 12px;border-radius:999px;cursor:pointer}
.drawer a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet,.open .drawer{transform:none}
.pop{border:1px solid var(--border);border-radius:var(--r-lg,12px);padding:12px 14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:240px;margin:0;font-size:14px}
.pop[popover]:popover-open{animation:up .15s ease-out}
.tt{position:relative;display:inline-block}
.tt [role=tooltip]{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(4px);background:#2b2d33;color:#fff;font-size:12px;padding:5px 8px;border-radius:var(--r-sm,6px);white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.tt:hover [role=tooltip],.tt:focus-within [role=tooltip]{opacity:1;transform:translateX(-50%)}
.ctx-area{flex:1;min-width:150px;height:90px;border:1px dashed color-mix(in srgb,var(--muted) 50%,transparent);border-radius:var(--r-md,10px);display:grid;place-items:center;font-size:13px;color:var(--muted);user-select:none;-webkit-user-select:none}
.ctx-menu{top:0;left:0}
.dlg.cmdk{padding:0;max-width:440px;overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:15px 16px;font-size:15px;outline:none!important;background:var(--surface)}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:240px;overflow:auto}
.cmdk li{padding:9px 12px;border-radius:var(--r-md,8px);font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.cmdk li.act{background:var(--primary-soft)}
.snack-wrap{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.snack{background:#2b2d33;color:#fff;border-radius:var(--r-md,8px);padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 12px rgb(0 0 0/.25);animation:up .25s ease-out;width:100%;max-width:320px;justify-content:space-between;transition:.2s}
.snack button{all:unset;color:#b3aeff;font-weight:600;cursor:pointer}
.snack.out{opacity:0;transform:translateY(8px)}
.al{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md,10px);font-size:13px;border:1px solid;width:100%}
.al button{all:unset;margin-left:auto;cursor:pointer;opacity:.6;font-size:16px;line-height:1}
.al.info{background:color-mix(in srgb,var(--primary) 9%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.al.success{background:color-mix(in srgb,var(--success) 10%,transparent);border-color:color-mix(in srgb,var(--success) 32%,transparent)}
.al.warn{background:color-mix(in srgb,var(--warn) 11%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.al.error{background:color-mix(in srgb,var(--danger) 9%,transparent);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.demo progress{width:100%;height:6px;appearance:none;-webkit-appearance:none;border:0;border-radius:var(--r-sm,3px);background:var(--border);overflow:hidden}
.demo progress::-webkit-progress-bar{background:var(--border)}
.demo progress::-webkit-progress-value{background:var(--primary);transition:width .2s}
.demo progress::-moz-progress-bar{background:var(--primary)}
.lin-ind{height:6px;border-radius:var(--r-sm,3px);background:var(--border);position:relative;overflow:hidden;width:100%}
.lin-ind::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:var(--primary);border-radius:var(--r-sm,3px);animation:ind 1.3s ease-in-out infinite}
@keyframes ind{from{left:-40%}to{left:100%}}
@property --v{syntax:'<number>';inherits:true;initial-value:0}
.ring{--v:0;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--v)*1%),var(--border) 0);display:grid;place-items:center;transition:--v .5s ease-out}
.ring span{width:62px;height:62px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite;flex:none}
.btn .spin{width:14px;height:14px;border-width:2px;border-color:color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:bob .9s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:none;opacity:1}}
.sk-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg,12px);padding:14px;width:100%;min-height:74px}
.sk{background:linear-gradient(90deg,var(--border) 25%,color-mix(in srgb,var(--border) 35%,var(--surface)) 50%,var(--border) 75%);background-size:200% 100%;animation:shim 1.4s infinite linear;border-radius:var(--r-sm,6px)}
.sk.av{width:44px;height:44px;border-radius:50%;flex:none}
.sk.l{height:12px}.sk.l.s{width:60%}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:700;flex:none}
.bdg-w{position:relative;display:inline-grid;place-items:center;width:40px;height:40px}
.bdg{position:absolute;top:3px;left:21px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-md,8px);background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.bdg.dot{min-width:8px;width:8px;height:8px;padding:0;top:8px;left:24px}
.cm{height:180px}
.cm .spot{position:relative;z-index:4;box-shadow:0 0 0 4px var(--surface),0 0 0 9999px rgb(0 0 0/.55);background:var(--surface)}
.cm-tip{position:absolute;z-index:5;top:62px;width:200px;background:var(--surface);border-radius:var(--r-lg,12px);padding:12px;box-shadow:var(--shadow);font-size:13px}
.cm-tip p{margin:0 0 8px}
.cm .start{position:absolute;left:12px;bottom:12px}
</style>
<script>
add('overlay',[
{id:'dialog',en:'Dialog',ko:'다이얼로그·모달',aka:'Modal · Modal dialog · 팝업(관용어)',src:'APG:dialog-modal M3:dialogs MDN:Web/HTML/Element/dialog',
 desc:'화면 위에 띄우는 창이에요. 확인이나 입력을 받아요. 모달(Modal)은 창을 닫기 전까지 뒤 화면을 누를 수 없고, 비모달은 뒤 화면도 쓸 수 있어요.',
 diff:'Dialog는 "창", Modal은 "뒤를 막는 성질"이에요. "팝업"은 새 브라우저 창을 뜻하기도 해서 개발 문서에서는 피하는 게 좋아요.',
 demo:`<div class="row"><button class="btn" data-m>모달 열기</button><button class="btn outline" data-n>비모달 열기</button></div><dialog class="dlg"><h4>변경사항을 저장할까요?</h4><p class="muted sm">모달은 뒤 화면을 막아요. 바깥(backdrop)을 누르거나 Esc로 닫을 수 있어요.</p><form method="dialog" class="row r"><button class="btn text">취소</button><button class="btn">저장</button></form></dialog>`,
 init(el){const d=$('dialog',el);$('[data-m]',el).onclick=()=>d.showModal();$('[data-n]',el).onclick=()=>d.show();d.onclick=e=>{if(e.target===d)d.close()}}},
{id:'alert-dialog',en:'Alert dialog',ko:'얼럿·확인 창',aka:'Confirm dialog · Alert (Apple)',src:'APG:alertdialog HIG:alerts',
 desc:'되돌릴 수 없는 동작(삭제, 결제 등)을 하기 전에 한 번 더 확인받는 창이에요. 버튼을 눌러 답해야 닫혀요.',
 diff:'배너형 Alert는 알리기만 하고 화면을 막지 않아요. 확인 창은 실수를 막으려고 처음 선택 위치를 "취소"에 둬요.',
 demo:`<button class="btn danger">계정 삭제</button><dialog class="dlg" role="alertdialog" aria-labelledby="ad-t"><h4 id="ad-t">정말 삭제할까요?</h4><p class="muted sm">계정과 모든 데이터가 영구 삭제되고 되돌릴 수 없어요.</p><form method="dialog" class="row r"><button class="btn text" value="cancel" autofocus>취소</button><button class="btn danger" value="delete">삭제</button></form></dialog><p class="muted sm out"></p>`,
 init(el){const d=$('dialog',el),o=$('.out',el);$('.btn',el).onclick=()=>{d.returnValue='';d.showModal()};d.onclose=()=>o.textContent=d.returnValue==='delete'?'삭제를 선택했어요':'취소했어요'}},
{id:'bottom-sheet',en:'Bottom sheet',ko:'바텀시트',aka:'Sheet (Apple) · Action sheet',src:'M3:bottom-sheets HIG:sheets',
 desc:'화면 아래에서 올라오는 패널이에요. 모바일에서 공유하기, 옵션 선택 같은 추가 메뉴를 보여줄 때 써요.',
 diff:'뒤를 어둡게 막는 Modal bottom sheet와, 본 화면과 함께 보이는 Standard bottom sheet가 있어요.',
 demo:`<div class="frame" style="height:200px"><button class="btn sm open-b">시트 열기</button><div class="scrim"></div><div class="sheet"><div class="handle"></div><b>공유하기</b><div class="row l"><button class="icon-btn filled" aria-label="링크 복사">${ic('copy')}</button><button class="icon-btn filled" aria-label="공유">${ic('share')}</button><button class="icon-btn filled" aria-label="저장">${ic('heart')}</button></div></div></div>`,
 init(el){const f=$('.frame',el);$('.open-b',el).onclick=()=>f.classList.add('open');$('.scrim',el).onclick=()=>f.classList.remove('open')}},
{id:'drawer',en:'Navigation drawer',ko:'드로어',aka:'Drawer · Side sheet · Off-canvas',src:'M3:navigation-drawer M3:side-sheets',
 desc:'화면 옆에서 밀려 나오는 패널이에요. 메뉴를 담으면 Navigation drawer, 필터 같은 보조 내용을 담으면 Side sheet라고 해요.',
 demo:`<div class="frame p0" style="height:200px"><div class="appbar"><button class="icon-btn" aria-label="메뉴 열기">${ic('menu')}</button><b class="ttl">받은편지함</b></div><div class="scrim"></div><nav class="drawer"><b>메일</b>${['받은편지함','보낸편지함','임시보관함','휴지통'].map((t,i)=>`<a class="${i?'':'on'}">${t}</a>`).join('')}</nav></div>`,
 init(el){const f=$('.frame',el);$('.icon-btn',el).onclick=()=>f.classList.add('open');$('.scrim',el).onclick=()=>f.classList.remove('open');
  $$('.drawer a',el).forEach(a=>a.onclick=()=>{$$('.drawer a',el).forEach(x=>x.classList.toggle('on',x===a));$('.ttl',el).textContent=a.textContent;f.classList.remove('open')})}},
{id:'popover',en:'Popover',ko:'팝오버',src:'MDN:Web/API/Popover_API HIG:popovers',
 desc:'버튼 바로 옆에 뜨는 작은 창이에요. 알림 목록처럼 간단한 정보나 조작을 담아요. 바깥을 누르면 닫혀요.',
 diff:'Tooltip은 마우스를 올리면 짧은 설명만 보여주고, Popover는 눌러서 열고 안에 버튼도 넣을 수 있어요.',
 demo:`<button class="btn outline" popovertarget="pop-demo">${ic('bell',16)} 알림</button><div id="pop-demo" popover class="pop"><b>새 알림 2개</b><p class="muted sm" style="margin:4px 0 10px">디자인 리뷰에 댓글이 달렸어요.</p><button class="btn sm tonal" popovertarget="pop-demo" popovertargetaction="hide">모두 읽음</button></div>`,
 init(el){const b=$('button',el),p=$('[popover]',el);p.addEventListener('toggle',e=>{if(e.newState!=='open')return;const r=b.getBoundingClientRect();p.style.position='fixed';p.style.inset='auto';p.style.top=r.bottom+8+'px';p.style.left=Math.max(8,Math.min(r.left,innerWidth-248))+'px'})}},
{id:'tooltip',en:'Tooltip',ko:'툴팁',src:'APG:tooltip M3:tooltips',
 desc:'아이콘에 마우스를 올리거나 키보드로 이동하면 잠깐 나타나는 짧은 설명이에요.',
 diff:'휴대폰에는 마우스 올리기가 없어서, 꼭 필요한 정보를 툴팁에만 넣으면 안 돼요.',
 demo:`<div class="row"><span class="tt"><button class="icon-btn" aria-label="삭제" aria-describedby="tt1">${ic('trash')}</button><span role="tooltip" id="tt1">휴지통으로 이동</span></span><span class="tt"><button class="icon-btn" aria-label="복사" aria-describedby="tt2">${ic('copy')}</button><span role="tooltip" id="tt2">복사 (⌘C)</span></span><span class="tt"><button class="icon-btn" aria-label="공유" aria-describedby="tt3">${ic('share')}</button><span role="tooltip" id="tt3">링크 공유</span></span></div><p class="muted sm">마우스를 올리거나 Tab으로 이동해 보세요</p>`},
{id:'menu',en:'Menu',ko:'메뉴·컨텍스트 메뉴',aka:'Dropdown menu · Context menu · 케밥(⋮) 메뉴',src:'APG:menu-button M3:menus HIG:menus',
 desc:'실행할 수 있는 동작 목록을 잠깐 펼쳐 보여주는 요소예요. ⋮ 버튼으로 여는 메뉴와, 우클릭으로 여는 Context menu가 있어요.',
 diff:'Select는 값을 고르고, Menu는 동작(이름 바꾸기, 삭제 등)을 실행해요.',
 demo:`<div class="row full"><div class="ctx-area">여기서 우클릭해 보세요</div><span class="split"><button class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-label="더보기">${ic('more')}</button><div class="menu" role="menu" hidden style="left:auto;right:0"><button role="menuitem">이름 바꾸기</button><button role="menuitem">복제</button><button role="menuitem">삭제</button></div></span></div><div class="menu ctx-menu" role="menu" hidden><button role="menuitem">잘라내기</button><button role="menuitem">복사</button><button role="menuitem">붙여넣기</button></div>`,
 init(el){menuToggle($('.icon-btn',el),$('.split .menu',el));const a=$('.ctx-area',el),m=$('.ctx-menu',el);
  a.oncontextmenu=e=>{e.preventDefault();const r=el.getBoundingClientRect();m.style.left=Math.min(e.clientX-r.left,r.width-190)+'px';m.style.top=e.clientY-r.top+'px';m.hidden=false;$('[role=menuitem]',m).focus()};
  document.addEventListener('click',()=>m.hidden=true);m.onkeydown=e=>{if(e.key==='Escape')m.hidden=true}}},
{id:'command-palette',en:'Command palette',ko:'커맨드 팔레트',aka:'Command menu · ⌘K 메뉴',src:'IDIOM APG:combobox',
 desc:'단축키(⌘K)로 여는 검색 창이에요. 기능 이름을 입력해서 바로 실행해요. VS Code, Slack, Notion 등에서 써요.',
 diff:'구조로 보면 Dialog 안에 Combobox가 들어 있는 형태예요.',
 demo:`<button class="btn outline">${ic('search',16)} 명령 검색 <kbd>⌘K</kbd></button><dialog class="dlg cmdk"><input placeholder="명령을 입력하세요…" aria-label="명령 검색"><ul role="listbox"></ul></dialog><p class="muted sm out">⌘K 또는 Ctrl+K로도 열려요</p>`,
 init(el){const d=$('dialog',el),i=$('input',el),ul=$('ul',el),o=$('.out',el),cmds=[['새 파일','⌘N'],['파일 열기','⌘O'],['저장','⌘S'],['테마 전환','⌘T'],['설정 열기','⌘,'],['터미널 열기','⌃`'],['로그아웃','']];let act=0,list=cmds;
  const draw=()=>{list=cmds.filter(c=>c[0].includes(i.value.trim()));act=Math.min(act,Math.max(0,list.length-1));ul.innerHTML=list.map((c,k)=>`<li role="option" class="${k===act?'act':''}" aria-selected="${k===act}">${c[0]}<kbd>${c[1]}</kbd></li>`).join('')||'<li class="muted">결과 없음</li>'};
  const run=c=>{if(!c)return;d.close();o.textContent=`실행: ${c[0]}`};
  const open=()=>{i.value='';act=0;draw();d.showModal()};
  $('.btn',el).onclick=open;i.oninput=()=>{act=0;draw()};
  i.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%list.length;draw()}if(e.key==='ArrowUp'){e.preventDefault();act=(act-1+list.length)%list.length;draw()}if(e.key==='Enter')run(list[act])};
  ul.onclick=e=>{const li=e.target.closest('li');if(li)run(list[[...ul.children].indexOf(li)])};d.onclick=e=>{if(e.target===d)d.close()};
  // 카드 데모와 모달 데모가 둘 다 있으면, 모달이 열려 있을 때는 모달 쪽만 반응해요
  const onK=e=>{if(!el.isConnected)return removeEventListener('keydown',onK);if(!((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))return;const dt=$('#detail');if(dt.open!==dt.contains(el))return;e.preventDefault();open()};
  addEventListener('keydown',onK)}},
{id:'snackbar',en:'Snackbar',ko:'스낵바·토스트',aka:'Toast',src:'M3:snackbar',
 desc:'화면 아래에 잠깐 나타났다 사라지는 짧은 알림이에요. "실행 취소" 같은 버튼 하나를 넣을 수 있어요.',
 diff:'Material 3의 공식 이름은 Snackbar예요. Toast도 같은 것을 부르는 말인데, 보통 버튼 없는 알림을 가리켜요.',
 demo:`<div class="frame" style="height:180px"><div class="row l"><button class="btn sm s1">메일 삭제</button><button class="btn sm tonal s2">토스트 쌓기</button></div><div class="snack-wrap" aria-live="polite"></div></div>`,
 init(el){const w=$('.snack-wrap',el);let n=0;const push=(t,a)=>{const s=document.createElement('div');s.className='snack';s.innerHTML=`<span>${t}</span>${a?`<button>${a}</button>`:''}`;w.append(s);while(w.children.length>3)w.firstChild.remove();
   const kill=()=>{s.classList.add('out');setTimeout(()=>s.remove(),200)};s.querySelector('button')?.addEventListener('click',()=>{kill();push('복구했어요')});setTimeout(kill,3500)};
  $('.s1',el).onclick=()=>push('메일을 삭제했어요','실행 취소');$('.s2',el).onclick=()=>push(`저장됨 #${++n}`)}},
{id:'alert',en:'Alert',ko:'배너·알림 메시지',aka:'Banner · Callout · Notification bar',src:'APG:alert IDIOM',
 desc:'페이지 안에 고정으로 보여주는 안내 상자예요. 안내, 성공, 주의, 오류 네 가지를 색으로 구분해요.',
 diff:'Snackbar는 몇 초 뒤 사라지고, Alert는 사용자가 닫거나 문제를 해결할 때까지 남아 있어요.',
 demo:`<div class="col full">${[['info','안내','3월 2일 새벽 2시~4시 점검이 있어요.'],['success','완료','결제가 정상적으로 처리됐어요.'],['warn','주의','저장 공간이 90% 찼어요.'],['error','오류','카드 정보를 확인해 주세요.']].map(([k,t,m])=>`<div class="al ${k}" role="${k==='error'?'alert':'status'}"><b>${t}</b><span>${m}</span><button aria-label="닫기">×</button></div>`).join('')}</div>`,
 init(el){el.onclick=e=>{if(e.target.closest('.al button'))e.target.closest('.al').remove()}}},
{id:'linear-progress',en:'Linear progress indicator',ko:'프로그레스 바',aka:'Progress bar',src:'M3:progress-indicators HIG:progress-indicators MDN:Web/HTML/Element/progress',
 desc:'작업이 얼마나 진행됐는지 막대로 보여줘요. 진행률을 알면 막대가 채워지고, 모르면 짧은 막대가 계속 오가요.',
 diff:'배터리, 저장 공간처럼 "현재 양"을 보여줄 때는 진행 막대가 아니라 &lt;meter&gt;를 써요.',
 demo:`<div class="col full"><div class="between sm"><span>업로드 중…</span><span class="pct">0%</span></div><progress max="100" value="0"></progress><span class="muted sm" style="margin-top:6px">Indeterminate</span><div class="lin-ind"></div></div>`,
 init(el){const p=$('progress',el),t=$('.pct',el);let v=0;const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);v=v>=100?0:v+4;p.value=v;t.textContent=v+'%'},250)}},
{id:'circular-progress',en:'Circular progress indicator',ko:'원형 프로그레스',src:'M3:progress-indicators',
 desc:'진행률을 원 둘레로 보여주는 표시예요. 공간이 좁은 곳에 써요.',
 demo:`<div class="row"><div class="ring"><span>0%</span></div><button class="btn sm tonal">+25%</button></div>`,
 init(el){const r=$('.ring',el),s=$('span',r);let v=0;$('button',el).onclick=()=>{v=v>=100?0:v+25;r.style.setProperty('--v',v);s.textContent=v+'%'}}},
{id:'loading-indicator',en:'Loading indicator',ko:'스피너·로딩 표시',aka:'Spinner · Activity indicator (Apple)',src:'M3:loading-indicator HIG:progress-indicators',
 desc:'얼마나 걸릴지 모르는 짧은 기다림을 알리는 회전 표시예요. 버튼 안에 넣어 "처리 중"을 알리기도 해요.',
 diff:'1초 안에 끝나는 작업에는 표시하지 않는 게 나아요. 화면 구조를 미리 알면 Skeleton이 더 빨라 보여요.',
 demo:`<div class="row"><div class="spin" role="status" aria-label="로딩 중"></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><button class="btn sm">저장</button></div>`,
 init(el){const b=$('.btn',el);b.onclick=()=>{b.disabled=true;b.innerHTML='<span class="spin"></span>저장 중';setTimeout(()=>{b.disabled=false;b.textContent='저장됨 ✓';setTimeout(()=>b.textContent='저장',1200)},1500)}}},
{id:'skeleton',en:'Skeleton',ko:'스켈레톤',aka:'Skeleton screen · Placeholder',src:'IDIOM',
 desc:'내용이 들어올 자리를 회색 블록으로 먼저 그려 두는 로딩 표시예요. 유튜브 첫 화면에서 볼 수 있어요.',
 diff:'스피너보다 어떤 내용이 나올지 미리 보여줘서 덜 기다리는 느낌을 줘요. 로딩이 끝나도 화면이 밀리지 않아요.',
 demo:`<div class="col full"><div class="sk-card"></div><button class="btn sm tonal" style="align-self:flex-start">다시 로드</button></div>`,
 init(el){const c=$('.sk-card',el);const load=()=>{c.innerHTML='<div class="sk av"></div><div class="col" style="flex:1"><div class="sk l"></div><div class="sk l s"></div></div>';setTimeout(()=>c.innerHTML='<div class="av">김</div><div class="col" style="gap:2px"><b>김개발</b><span class="muted sm">프론트엔드 개발자 · 서울</span></div>',1600)};$('button',el).onclick=load;load()}},
{id:'badge',en:'Badge',ko:'배지',aka:'Dot indicator · Counter · Status label',src:'M3:badges',
 desc:'아이콘 모서리에 붙는 작은 점이나 숫자예요. 새 알림이나 안 읽은 메시지 수를 알려줘요.',
 diff:'"NEW", "완료"처럼 혼자 쓰는 상태 표시는 보통 Status label이나 Tag라고 불러요.',
 demo:`<div class="row"><span class="bdg-w">${ic('bell',22)}<span class="bdg dot"></span></span><span class="bdg-w">${ic('inbox',22)}<span class="bdg">3</span></span><span class="bdg-w">${ic('heart',22)}<span class="bdg">999+</span></span><span class="pill">NEW</span><span class="pill ok">완료</span><span class="pill no">실패</span></div>`},
{id:'coach-mark',en:'Coach mark',ko:'코치마크·온보딩 투어',aka:'Product tour · Spotlight · Walkthrough',src:'IDIOM',
 desc:'앱을 처음 쓰는 사람에게 버튼을 하나씩 강조하며 사용법을 알려주는 안내예요.',
 diff:'"건너뛰기"를 꼭 넣고, 3~4단계 안으로 짧게 만들어요.',
 demo:`<div class="frame p0 cm"><div class="appbar"><b>홈</b><span style="margin-left:auto;display:flex"><button class="icon-btn" aria-label="검색">${ic('search')}</button><button class="icon-btn" aria-label="알림">${ic('bell')}</button><button class="icon-btn" aria-label="내 정보">${ic('user')}</button></span></div><div class="cm-tip" hidden><p></p><div class="between"><span class="muted sm step"></span><span><button class="btn sm text skip">건너뛰기</button><button class="btn sm next">다음</button></span></div></div><button class="btn sm tonal start">투어 시작</button></div>`,
 init(el){const f=$('.cm',el),bs=$$('.icon-btn',f),tip=$('.cm-tip',f),txt=['여기서 무엇이든 검색할 수 있어요.','새 소식은 알림에서 확인해요.','내 정보와 설정은 여기 있어요.'];let k=-1;
  const show=()=>{bs.forEach(b=>b.classList.remove('spot'));if(k<0||k>=bs.length){tip.hidden=true;k=-1;return}const b=bs[k];b.classList.add('spot');tip.hidden=false;$('p',tip).textContent=txt[k];$('.step',tip).textContent=`${k+1} / ${bs.length}`;$('.next',tip).textContent=k===bs.length-1?'완료':'다음';
   tip.style.left=Math.max(8,Math.min(b.offsetLeft+b.offsetWidth/2-100,f.clientWidth-208))+'px'};
  $('.start',f).onclick=()=>{k=0;show()};$('.next',f).onclick=()=>{k++;show()};$('.skip',f).onclick=()=>{k=-1;show()}}},
]);
</script>

<style>
.phone{width:100%;max-width:280px;height:200px;border:1px solid var(--border);border-radius:var(--r-lg,22px);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.ph-body{flex:1;padding:16px;font-size:18px}
.navbar{display:flex;background:var(--surface-2);border-top:1px solid var(--border)}
.navbar button,.rail button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;font-size:11px;cursor:pointer;color:var(--muted)}
.navbar .ind,.rail .ind{width:56px;height:30px;border-radius:var(--r-lg,15px);display:grid;place-items:center;transition:background .2s}
.navbar .on,.rail .on{color:var(--text);font-weight:600}
.navbar .on .ind,.rail .on .ind{background:var(--primary-soft);color:var(--primary)}
.gnb{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);padding:8px 10px 8px 14px;width:100%;font-size:13px}
.gnb nav{display:flex;gap:12px;flex:1}
.gnb a{color:var(--muted);cursor:pointer;white-space:nowrap}
.gnb a.on{color:var(--text);font-weight:600}
.logo{display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo::before{content:'';width:14px;height:14px;border-radius:var(--r-sm,4px);background:var(--primary)}
.appbar.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);width:100%}
.rail-demo{display:flex;height:180px}
.rail{width:76px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 0;background:var(--surface-2)}
.rail button{flex:none}
.sbd{display:flex;height:190px}
.sbar{width:170px;transition:width .25s;border-right:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:none;background:var(--surface-2)}
.sbar a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-md,8px);font-size:13px;white-space:nowrap;cursor:pointer}
.sbar a svg{flex:none}
.sbar a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.sbar span{transition:opacity .2s}
.sbd.collapsed .sbar{width:54px}
.sbd.collapsed .sbar span{opacity:0}
.tabs [role=tablist]{display:flex;position:relative;border-bottom:1px solid var(--border)}
.tabs [role=tab]{all:unset;flex:1;text-align:center;padding:10px 0;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs [aria-selected=true]{color:var(--primary);font-weight:600}
.ink{position:absolute;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary);transition:.25s cubic-bezier(.2,.8,.2,1)}
.tp{padding:14px 4px;font-size:14px}
.bc ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;font-size:14px}
.bc li+li::before{content:'›';margin-right:6px;color:var(--muted)}
.bc a{color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bc [aria-current]{font-weight:600}
.pg{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pg button{all:unset;min-width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md,8px);font-size:13px;cursor:pointer}
.pg button:hover:not(:disabled){background:var(--border)}
.pg [aria-current=page]{background:var(--primary);color:var(--on-primary);font-weight:600}
.pg button:disabled{opacity:.3;cursor:default}
.pg span{min-width:20px;text-align:center;align-self:center;color:var(--muted)}
.hb{all:unset;width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;border-radius:var(--r-md,10px);background:var(--surface);border:1px solid var(--border)}
.hb span{width:22px;height:2px;background:var(--text);border-radius:var(--r-sm,2px);transition:.25s}
.hb[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hb[aria-expanded=true] span:nth-child(2){opacity:0}
.hb[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.hb-menu{display:flex;flex-direction:column;gap:2px;font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);padding:6px;width:180px;animation:up .2s}
.hb-menu a{padding:8px 10px;border-radius:var(--r-sm,6px);cursor:pointer}
.hb-menu a:hover{background:var(--surface-2)}
.mm{position:relative;width:100%;align-self:flex-start}
.mm .gnb button{all:unset;cursor:pointer;color:var(--muted)}
.mm .gnb button[aria-expanded=true]{color:var(--text);font-weight:600}
.mm-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg,12px);box-shadow:var(--shadow);padding:14px;z-index:6;font-size:13px;animation:up .15s}
.mm-panel b{display:block;margin-bottom:6px;font-size:11px;color:var(--muted)}
.mm-panel a{display:block;padding:3px 0;cursor:pointer}
.steps{list-style:none;margin:0;padding:0;display:flex;font-size:12px;width:100%}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;color:var(--muted)}
.steps li::before{content:'';position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--border)}
.steps li:first-child::before{display:none}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border);font-weight:700;position:relative}
.steps .done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.steps .done::before,.steps .cur::before{background:var(--primary)}
.steps .cur .dot{border-color:var(--primary);color:var(--primary)}
.steps .cur{color:var(--text);font-weight:600}
.spy{display:flex;gap:12px;width:100%;height:180px}
.spy nav{display:flex;flex-direction:column;font-size:13px;border-left:2px solid var(--border);flex:none;width:76px}
.spy nav a{padding:4px 10px;margin-left:-2px;border-left:2px solid transparent;cursor:pointer;color:var(--muted)}
.spy nav a.on{border-color:var(--primary);color:var(--primary);font-weight:600}
.spy-body{flex:1;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px);padding:0 12px;font-size:13px;scroll-behavior:smooth}
.spy-body section{padding:10px 0 30px}
.spy-body h5{margin:0 0 6px;font-size:14px}
.spy-body p{margin:0 0 6px;color:var(--muted)}
.feed{width:100%;height:190px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,10px)}
.feed article{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;align-items:center;animation:up .3s}
.feed article .av{width:30px;height:30px;font-size:12px}
.feed .sent{padding:14px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.lm{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.lm li{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,8px);padding:10px 4px;font-size:12px;text-align:center;animation:up .3s}
.btt-w{height:190px}
.btt-body{height:100%;overflow:auto;padding:12px;font-size:13px;color:var(--muted)}
.btt-body p{margin:0 0 10px}
.btt{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
.btt.show{opacity:1;transform:none;pointer-events:auto}
</style>
<script>
const NAV4=[['home','홈'],['search','검색'],['heart','저장'],['user','내 정보']];
add('nav',[
{id:'navigation-bar',en:'Navigation bar',ko:'하단 내비게이션 바',aka:'Tab bar (Apple) · Bottom navigation · 하단 탭',src:'M3:navigation-bar HIG:tab-bars',
 desc:'모바일 화면 맨 아래에 있는 3~5개의 주요 메뉴예요. 카카오톡, 인스타그램의 하단 메뉴가 대표적이에요.',
 diff:'이름이 헷갈려요. Material 3의 Navigation bar는 하단 메뉴이고, Apple의 Navigation bar는 상단 바예요. Apple은 하단 메뉴를 Tab bar라고 불러요.',
 demo:`<div class="phone"><div class="ph-body"><b class="t">홈</b></div><nav class="navbar">${NAV4.map(([i,t],k)=>`<button class="${k?'':'on'}"><span class="ind">${ic(i)}</span>${t}</button>`).join('')}</nav></div>`,
 init(el){const bs=$$('.navbar button',el);bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));$('.t',el).textContent=b.textContent})}},
{id:'top-app-bar',en:'Top app bar',ko:'상단 바·GNB',aka:'App bar · Header · Navigation bar (Apple) · GNB(국내 관용어)',src:'M3:app-bars HIG:toolbars',
 desc:'화면 맨 위의 막대예요. 제목, 뒤로 가기, 주요 버튼이 들어가요. 웹사이트의 상단 메뉴는 국내에서 GNB(Global Navigation Bar)라고 많이 불러요.',
 diff:'GNB, LNB는 국내에서 주로 쓰는 말이라 해외 자료를 찾을 때는 Header, Top app bar, Navigation bar로 검색해요.',
 demo:`<div class="col full"><span class="muted sm">웹 (GNB)</span><div class="gnb"><b class="logo">Brand</b><nav><a class="on">제품</a><a>가격</a><a>블로그</a></nav><button class="btn sm">로그인</button></div><span class="muted sm">모바일 앱 (Top app bar)</span><div class="appbar box"><button class="icon-btn" aria-label="뒤로">${ic('chev-l')}</button><b>설정</b><span style="margin-left:auto"><button class="icon-btn" aria-label="더보기">${ic('more')}</button></span></div></div>`},
{id:'navigation-rail',en:'Navigation rail',ko:'내비게이션 레일·LNB',aka:'Side navigation · LNB(국내 관용어)',src:'M3:navigation-rail',
 desc:'화면 왼쪽에 아이콘과 짧은 글자를 세로로 놓은 메뉴예요. 태블릿처럼 중간 크기 화면에 써요.',
 diff:'LNB(Local Navigation Bar)는 국내 기획 문서에서 쓰는 말로, 원래는 특정 메뉴 안의 하위 메뉴를 뜻해요. 해외 자료에서는 Navigation rail이나 Sidebar로 찾아요.',
 demo:`<div class="frame p0 rail-demo"><nav class="rail">${NAV4.map(([i,t],k)=>`<button class="${k?'':'on'}"><span class="ind">${ic(i)}</span>${t}</button>`).join('')}</nav><div class="pad"><b class="t">홈</b><p class="muted sm">중간 크기 화면에서 하단 바 대신 써요.</p></div></div>`,
 init(el){const bs=$$('.rail button',el);bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));$('.t',el).textContent=b.textContent})}},
{id:'sidebar',en:'Sidebar',ko:'사이드바',aka:'Side panel · Collapsible sidebar',src:'HIG:sidebars IDIOM',
 desc:'화면 옆에 세로로 놓인 메뉴 영역이에요. 폴더나 프로젝트 목록을 담아요. 접어서 아이콘만 남길 수도 있어요.',
 diff:'Navigation rail보다 넓어서 폴더처럼 단계가 있는 목록도 담을 수 있어요.',
 demo:`<div class="frame p0 sbd"><aside class="sbar"><button class="icon-btn tg" aria-label="사이드바 접기" aria-expanded="true">${ic('menu')}</button>${[['home','대시보드'],['inbox','받은편지함'],['folder','프로젝트'],['file','문서'],['user','팀원']].map(([i,t],k)=>`<a class="${k?'':'on'}">${ic(i,18)}<span>${t}</span></a>`).join('')}</aside><div class="pad muted sm">본문 영역</div></div>`,
 init(el){const f=$('.sbd',el),b=$('.tg',el);b.onclick=()=>{const c=f.classList.toggle('collapsed');b.setAttribute('aria-expanded',!c)};const as=$$('.sbar a',el);as.forEach(a=>a.onclick=()=>as.forEach(x=>x.classList.toggle('on',x===a)))}},
{id:'tabs',en:'Tabs',ko:'탭',src:'APG:tabs M3:tabs',
 desc:'한 화면 안에서 내용을 여러 칸으로 나눠 바꿔 보게 하는 메뉴예요. 상품 페이지의 상세/리뷰/문의가 대표적이에요.',
 diff:'하단 Navigation bar는 앱의 다른 화면으로 이동하고, Tabs는 같은 화면 안의 내용만 바꿔요.',
 demo:`<div class="tabs full"><div role="tablist" aria-label="상품 정보">${['상세','리뷰 128','문의'].map((t,i)=>`<button role="tab" aria-selected="${!i}" tabindex="${i?-1:0}">${t}</button>`).join('')}<span class="ink"></span></div><div role="tabpanel" class="tp"></div></div>`,
 init(el){const ts=$$('[role=tab]',el),ink=$('.ink',el),p=$('.tp',el),body=['상품의 소재, 크기, 구성품 정보예요.','★★★★☆ 4.6 · "배송이 빨라요"','궁금한 점을 판매자에게 물어보세요.'];
  const sel=t=>{ts.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1});ink.style.left=t.offsetLeft+'px';ink.style.width=t.offsetWidth+'px';p.textContent=body[ts.indexOf(t)]};
  ts.forEach((t,i)=>{t.onclick=()=>sel(t);t.onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){const n=ts[(i+d+ts.length)%ts.length];sel(n);n.focus()}}});
  requestAnimationFrame(()=>sel(ts[0]))}},
{id:'breadcrumb',en:'Breadcrumb',ko:'브레드크럼',aka:'경로 표시 · 이동 경로',src:'APG:breadcrumb',
 desc:'지금 페이지가 사이트의 어디에 있는지 "홈 › 전자기기 › 노트북"처럼 경로로 보여줘요. 앞 단계를 눌러 바로 이동할 수 있어요.',
 demo:`<nav aria-label="Breadcrumb" class="bc"><ol><li><a>홈</a></li><li><a>전자기기</a></li><li><a>노트북</a></li><li aria-current="page">맥북 프로 14</li></ol></nav>`},
{id:'pagination',en:'Pagination',ko:'페이지네이션',aka:'Pager · 페이지 번호',src:'IDIOM',
 desc:'긴 목록을 여러 페이지로 나누고 번호로 이동하게 해요. 게시판, 검색 결과에 써요.',
 diff:'다시 찾아보고 비교하는 목록은 페이지 번호가 좋고, SNS 피드처럼 훑어보는 목록은 무한 스크롤이나 더보기 버튼이 맞아요.',
 demo:`<nav class="pg" aria-label="페이지"></nav>`,
 init(el){const nav=$('.pg',el),N=20;let cur=1;const draw=()=>{const s=new Set([1,N,cur-1,cur,cur+1].filter(n=>n>=1&&n<=N)),a=[...s].sort((x,y)=>x-y);let h=`<button data-p="${cur-1}" aria-label="이전" ${cur===1?'disabled':''}>‹</button>`,prev=0;
  a.forEach(n=>{if(n-prev>1)h+='<span>…</span>';h+=`<button data-p="${n}" ${n===cur?'aria-current="page"':''}>${n}</button>`;prev=n});nav.innerHTML=h+`<button data-p="${cur+1}" aria-label="다음" ${cur===N?'disabled':''}>›</button>`};
  nav.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){cur=+b.dataset.p;draw()}};draw()}},
{id:'hamburger',en:'Hamburger menu',ko:'햄버거 메뉴',aka:'Menu button · ☰',src:'IDIOM APG:disclosure',
 desc:'세 줄 아이콘(☰)을 눌러 숨겨 둔 메뉴를 여는 버튼이에요. 화면이 좁을 때 메뉴를 감추려고 써요.',
 diff:'메뉴가 숨어 있으면 사람들이 잘 찾지 못해요. 모바일 앱이라면 하단 메뉴(Navigation bar)를 먼저 고려해요.',
 demo:`<div class="col" style="align-items:center"><button class="hb" aria-label="메뉴" aria-expanded="false"><span></span><span></span><span></span></button><nav class="hb-menu" hidden><a>홈</a><a>회사 소개</a><a>채용</a><a>문의</a></nav></div>`,
 init(el){const b=$('.hb',el),m=$('.hb-menu',el);b.onclick=()=>{const o=m.hidden;m.hidden=!o;b.setAttribute('aria-expanded',o)}}},
{id:'mega-menu',en:'Mega menu',ko:'메가 메뉴',src:'IDIOM APG:disclosure/examples/disclosure-navigation',
 desc:'상단 메뉴에 마우스를 올리거나 누르면 여러 열로 된 큰 패널이 펼쳐지는 메뉴예요. 쇼핑몰 카테고리 메뉴가 대표적이에요.',
 diff:'마우스 올리기로만 열리면 휴대폰과 키보드에서는 쓸 수 없어요. 클릭으로도 열리게 만들어요.',
 demo:`<div class="mm"><div class="gnb"><b class="logo">Shop</b><nav><button aria-expanded="false">카테고리 ▾</button><a>세일</a><a>신상품</a></nav></div><div class="mm-panel" hidden><div><b>의류</b><a>상의</a><a>하의</a><a>아우터</a></div><div><b>신발</b><a>운동화</a><a>구두</a><a>샌들</a></div><div><b>잡화</b><a>가방</a><a>모자</a><a>시계</a></div></div></div>`,
 init(el){const b=$('.gnb button',el),p=$('.mm-panel',el),w=$('.mm',el);const set=o=>{p.hidden=!o;b.setAttribute('aria-expanded',o)};b.onclick=e=>{e.stopPropagation();set(p.hidden)};
  b.onmouseenter=()=>set(true);w.onmouseleave=()=>set(false);document.addEventListener('click',e=>{if(!w.contains(e.target))set(false)})}},
{id:'stepper',en:'Stepper',ko:'스텝 인디케이터',aka:'Step indicator · Progress steps · Wizard',src:'IDIOM',
 desc:'여러 단계로 된 과정에서 지금 몇 번째 단계인지 보여줘요. 회원가입, 주문 과정에 써요.',
 diff:'이렇게 단계를 나눠 진행하는 화면 흐름 전체를 Wizard라고 불러요.',
 demo:`<div class="col full" style="gap:14px"><ol class="steps">${['장바구니','배송지','결제','완료'].map((s,i)=>`<li><span class="dot">${i+1}</span>${s}</li>`).join('')}</ol><div class="row"><button class="btn sm outline prev">이전</button><button class="btn sm next">다음</button></div></div>`,
 init(el){const ls=$$('.steps li',el);let c=1;const draw=()=>{ls.forEach((l,i)=>{l.className=i<c?'done':i===c?'cur':'';l.toggleAttribute('aria-current',i===c);$('.dot',l).textContent=i<c?'✓':i+1});$('.prev',el).disabled=c===0;$('.next',el).disabled=c===ls.length-1};
  $('.prev',el).onclick=()=>{c--;draw()};$('.next',el).onclick=()=>{c++;draw()};draw()}},
{id:'scrollspy',en:'Scrollspy',ko:'스크롤 스파이·목차',aka:'Table of contents · Anchor navigation',src:'IDIOM MDN:Web/API/Intersection_Observer_API',
 desc:'스크롤 위치에 따라 목차에서 지금 읽는 부분을 강조해요. 기술 문서 사이트의 오른쪽 목차가 대표적이에요.',
 demo:`<div class="spy"><nav>${['개요','설치','사용법','FAQ'].map((s,i)=>`<a data-i="${i}" class="${i?'':'on'}">${s}</a>`).join('')}</nav><div class="spy-body">${['개요','설치','사용법','FAQ'].map((s,i)=>`<section data-i="${i}"><h5>${s}</h5>${paras(3)}</section>`).join('')}</div></div>`,
 init(el){const body=$('.spy-body',el),as=$$('nav a',el),ss=$$('section',el);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)as.forEach(a=>a.classList.toggle('on',a.dataset.i===e.target.dataset.i))}),{root:body,rootMargin:'0px 0px -75% 0px'});ss.forEach(s=>io.observe(s));
  as.forEach(a=>a.onclick=()=>body.scrollTo({top:ss[a.dataset.i].offsetTop-body.offsetTop}))}},
{id:'infinite-scroll',en:'Infinite scroll',ko:'무한 스크롤',aka:'Feed · Endless scroll',src:'APG:feed IDIOM',
 desc:'목록 끝에 닿으면 다음 내용을 자동으로 불러와 이어 붙여요. SNS 피드가 대표적이에요.',
 diff:'맨 아래(푸터)에 닿을 수 없고, 보던 위치를 다시 찾기 어려워요. 상품 목록처럼 다시 찾아봐야 하는 곳에는 맞지 않아요.',
 demo:`<div class="feed" role="feed" aria-busy="false"><div class="sent"></div></div>`,
 init(el){const f=$('.feed',el),s=$('.sent',el);let n=0,busy=false;const more=()=>{for(let i=0;i<6;i++){n++;const a=document.createElement('article');a.innerHTML=`<span class="av">${n}</span><span>피드 항목 ${n} · 새 게시물이에요</span>`;f.insertBefore(a,s)}};
  more();const io=new IntersectionObserver(es=>{if(!es[0].isIntersecting||busy)return;if(n>=36){s.textContent='모든 항목을 불러왔어요';return}busy=true;f.setAttribute('aria-busy',true);s.innerHTML='<div class="spin"></div>';setTimeout(()=>{more();s.textContent='';busy=false;f.setAttribute('aria-busy',false)},700)},{root:f});io.observe(s)}},
{id:'load-more',en:'Load more button',ko:'더보기 버튼',src:'IDIOM',
 desc:'버튼을 누를 때만 다음 목록을 불러와요.',
 diff:'무한 스크롤과 달리 사용자가 원할 때만 불러오고, 맨 아래 내용에도 닿을 수 있어요.',
 demo:`<div class="col full" style="align-items:center"><ul class="lm"></ul><button class="btn sm outline"></button></div>`,
 init(el){const ul=$('.lm',el),b=$('button',el),N=12;let n=0;const more=()=>{for(let i=0;i<3&&n<N;i++)ul.insertAdjacentHTML('beforeend',`<li>상품 ${++n}</li>`);b.textContent=n<N?`더보기 (${n}/${N})`:'모두 봤어요';b.disabled=n>=N};b.onclick=more;more()}},
{id:'back-to-top',en:'Back to top',ko:'맨 위로 버튼',aka:'Scroll to top',src:'IDIOM',
 desc:'긴 페이지를 내려가면 나타나고, 누르면 맨 위로 한 번에 올라가는 버튼이에요.',
 demo:`<div class="frame p0 btt-w"><div class="btt-body">${paras(10)}</div><button class="btt" aria-label="맨 위로">${ic('arrow-up')}</button></div>`,
 init(el){const b=$('.btt-body',el),t=$('.btt',el);b.onscroll=()=>t.classList.toggle('show',b.scrollTop>80);t.onclick=()=>b.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})}},
]);
</script>
