    if(!e.isTrusted)return;
    const path=e.composedPath(),dd=e.target.closest?.('.dd');
    DDS().forEach(x=>{if(!path.includes(x))setDD(x,false)});
    if(!dd)return;
    if(e.target.closest('.dd-btn'))return setDD(dd,$('.dd-pop',dd).hidden);
    const del=e.target.closest('.dd-del');
    if(del)return removePal(del.dataset.del);
    const opt=e.target.closest('.dd-opt');
    if(opt){
      theme[dd.dataset.kind]=opt.dataset.v;
      // 회사를 고르면 그 회사 글꼴도 함께 (무료 글꼴 목록에 있을 때만). 글꼴은 따로 다시 바꿀 수 있어요
      const co=dd.dataset.kind==='pal'&&COMPANIES.find(x=>x.id===opt.dataset.v);
      if(co?.font&&FONTS.some(f=>f.id===co.font))theme.font=co.font;
      applyTheme();drawAll();setDD(dd,false);$('.dd-btn',dd).focus()}
  });
  document.addEventListener('input',e=>{if(e.target.matches?.('.font-q'))filterDD(e.target.closest('.dd'))});
  // 키보드: ↓·↑로 열고 옮겨 다니고, Esc로 닫아요 (패널·모달은 열린 채로)
  document.addEventListener('keydown',e=>{
    const dd=e.target.closest?.('.dd');if(!dd)return;
    const pop=$('.dd-pop',dd);
    if(e.key==='Escape'&&!pop.hidden){e.preventDefault();e.stopPropagation();setDD(dd,false);$('.dd-btn',dd).focus();return}
    if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
    e.preventDefault();
    if(pop.hidden)return setDD(dd,true);
    const os=$$('.dd-row:not([hidden]) .dd-opt',dd),i=os.indexOf(document.activeElement);
    (os[e.key==='ArrowDown'?Math.min(os.length-1,i+1):Math.max(0,i-1)]||os[0])?.focus();
  },true);

  const tBtn=$('#theme-btn'),tPanel=$('#tpanel'),tSec=$('.dt-theme',dlg);
  function drawTerm(){if(cur)$$('.dd',tSec).forEach(drawDD)}
  const setPanel=o=>{tPanel.hidden=!o;tBtn.setAttribute('aria-expanded',o);if(o)drawAll();else DDS().forEach(x=>setDD(x,false))};
  if(location.protocol.startsWith('http'))fetch('/fonts.json').then(r=>r.ok?r.json():[]).then(list=>{
    for(const f of list)if(!FONTS.some(x=>x.family===f.family))FONTS.splice(FONTS.length-1,0,f); // '시스템 기본'은 맨 뒤에
    drawAll();
  }).catch(()=>{});
  // 회사 팔레트: 배포 때 oh-my-design의 검증된 DESIGN.md에서 색만 뽑은 companies.json
  if(location.protocol.startsWith('http'))fetch('/companies.json').then(r=>r.ok?r.json():[]).then(list=>{COMPANIES.push(...list);drawAll()}).catch(()=>{});
  tBtn.onclick=e=>{e.stopPropagation();setPanel(tPanel.hidden)};
  document.addEventListener('click',e=>{if(!e.isTrusted)return;const path=e.composedPath();if(!tPanel.hidden&&!path.includes(tPanel)&&!path.includes(tBtn))setPanel(false)});
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!tPanel.hidden){setPanel(false);tBtn.focus()}});
  tPanel.addEventListener('click',e=>{
    if(!e.target.closest('.tp-reset'))return;
    Object.assign(theme,DEFAULT);
    aiMsg.textContent='처음 설정으로 되돌렸어요. AI로 만든 팔레트는 목록에 남아 있어요.';applyTheme();drawAll();
  });
  // ── 내보내기: design.md, Hex 코드, 용어별 AI 프롬프트 ──
  const ROLE_INFO={primary:['강조색','주요 버튼, 선택 상태, 링크'],onPrimary:['강조색 위 글자','강조색 배경 위의 글자·아이콘'],primarySoft:['연한 강조색','보조 버튼, 선택된 칩 배경'],surface:['표면','카드, 입력칸, 모달 배경'],surface2:['보조 표면','구역 배경, 마우스를 올렸을 때 배경'],text:['본문 글자','제목, 본문'],muted:['보조 글자','설명, 도움말'],border:['테두리','입력칸·카드 테두리, 구분선']};
  const resolved=()=>({f:FONTS.find(x=>x.id===theme.font)||FONTS[0],p:pals().find(x=>x.id===theme.pal)||PALS[0]});
  window.themeVars=()=>{const{f,p}=resolved();return{vars:{...Object.fromEntries(Object.entries(ROLES).map(([r,v])=>[v,p[r]])),'--demo-font':stack(f)},css:f.css}};
  const plain=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent.trim()};
  const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
  const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  const hexText=(p,title)=>`${title}\n`+Object.entries(ROLES).map(([r,v])=>`${ROLE_INFO[r][0]}\t${v}\t${p[r]}`).join('\n');
  const cssVars=(f,p)=>`:root {\n${Object.entries(ROLES).map(([r,v])=>`  ${v}: ${p[r]};`).join('\n')}\n  --font-sans: ${stack(f)};\n${Object.entries(p.radius||{}).map(([k,v])=>`  --r-${k}: ${v};\n`).join('')}}`;
  const designMd=()=>{
    const{f,p}=resolved(),date=new Date().toISOString().slice(0,10);
    const pairs=[['본문 글자 / 표면','text','surface'],['보조 글자 / 표면','muted','surface'],['강조색 위 글자 / 강조색','onPrimary','primary'],['강조색 / 연한 강조색','primary','primarySoft']];
    return [
      '# DESIGN.md — UI GuideBook 예시 테마','',
      `UI GuideBook(${location.origin}/)에서 ${date}에 내보낸 디자인 토큰이에요. AI 코딩 도구나 개발자가 이 파일을 읽고 같은 글꼴과 색으로 UI를 만들 수 있어요.`,'',
      '## 타이포그래피','',
      `- 글꼴: **${f.name}** (${CAT_KO[f.category]||f.category||'-'}) — 라이선스: ${f.license||'-'}`,
      `- font-family: \`${stack(f)}\``,
      ...(f.css?[`- 불러오기: \`<link rel="stylesheet" href="${f.css}">\``]:[]),'',
      ...(()=>{const x=ICON_SETS.find(i=>i.id===theme.icon);return['## 아이콘','',x.site?`- **${x.name}** (${x.site}). 움직이는 버전은 \`@animateicons/vanilla\`(React는 \`@animateicons/react\`)의 \`${x.id}\` 모음이에요.`:'- 선 굵기 2px, 둥근 끝의 단순한 선 아이콘이에요.','- 크기 20px(작은 곳 16~18px), 색은 글자색(currentColor)을 따라요.','']})(),
      `## 색 — ${p.name}`,'',
      ...(p.src?[`출처: [oh-my-design](${p.src})에서 정리한 ${p.name}의 공개 디자인 값이에요. 회사 공식 파일은 아니고, 디자인 권리는 해당 회사에 있어요.${p.unverified?' 아직 출처 검증을 마치지 않은 값이에요.':''}`,'']:[]),
      '| 역할 | CSS 변수 | Hex | 쓰는 곳 |','|---|---|---|---|',
      ...Object.entries(ROLES).map(([r,v])=>`| ${ROLE_INFO[r][0]} | \`${v}\` | \`${p[r]}\` | ${ROLE_INFO[r][1]} |`),'',
      ...(p.radius?['## 모서리 둥글기','','| 크기 | CSS 변수 | 값 |','|---|---|---|',...Object.entries(p.radius).map(([k,v])=>`| ${{sm:'작게 (칩, 배지)',md:'중간 (입력칸)',lg:'크게 (카드)',btn:'버튼'}[k]} | \`--r-${k}\` | \`${v}\` |`),'']:[]),
      '## 명도 대비 (WCAG 2.2 AA 기준 4.5:1)','',
      '| 조합 | 대비 | AA |','|---|---|---|',
      ...pairs.map(([n,a,b])=>{const v=ratio(p[a],p[b]);return `| ${n} | ${v.toFixed(2)}:1 | ${v>=4.5?'통과':'미달'} |`}),'',
      '## CSS 변수','','```css',cssVars(f,p),'```','',
      '## 사용 원칙','',
      '- 강조색은 화면에서 가장 중요한 동작(주요 버튼, 선택 상태)에만 써요.',
      '- 강조색 배경 위에는 "강조색 위 글자" 색만 올려요.',
      '- 본문은 "본문 글자", 설명과 도움말은 "보조 글자"를 써요. 둘 다 표면 위에서 4.5:1 이상이에요.',
      '- 오류·성공·주의 같은 의미 색은 이 팔레트와 별개로 유지해요.',
      '',
    ].join('\n');
  };
  const promptFor=id=>{
    const t=byId[id],{f,p}=resolved();
    const how=(HOW[id]||[]).map(x=>'- '+plain(x)).join('\n');
    const refs=t.src.split(' ').filter(x=>x.includes(':')).map(tok=>{const i=tok.indexOf(':'),[name,fn]=SRC[tok.slice(0,i)];return `- ${name}: ${fn(tok.slice(i+1))}`}).join('\n');
    return [
      `${t.en}(${plain(t.ko)}) UI 컴포넌트를 만들어 주세요.`,'',
      '## 무엇인가',plain(t.desc),...(t.aka?['',`다른 이름: ${plain(t.aka)}`]:[]),
      ...(how?['','## 동작',how]:[]),
      ...(t.diff?['','## 헷갈리기 쉬운 점',plain(t.diff)]:[]),
      ...(refs?['','## 참고 명세',refs]:[]),
      '','## 디자인 토큰 (CSS 변수로 정의해서 써 주세요)','```css',cssVars(f,p),'```',
      '','## 요구 사항',
      '- 위 디자인 토큰만으로 색과 글꼴을 정해 주세요.',
      '- 키보드로 모든 동작을 할 수 있고, 키보드 포커스 표시가 보여야 해요.',
      '- 알맞은 HTML 요소와 ARIA 속성을 써서 화면 낭독기가 역할과 상태를 읽을 수 있게 해 주세요.',
      '- 움직임이 있다면 prefers-reduced-motion 설정을 존중해 주세요.',
      '- 휴대폰 화면에서도 쓸 수 있게 해 주세요.',
    ].join('\n');
  };
  // 복사: 클립보드 API가 막히면 화면 밖 입력칸으로 대신 복사해요 (모달 안에서도 되게 버튼 옆에 붙여요)
  const copyText=async(text,btn)=>{
    let ok=true;
    try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';btn.after(ta);ta.select();ok=document.execCommand('copy');ta.remove()}
    const label=btn.dataset.label||(btn.dataset.label=btn.textContent);
    btn.textContent=ok?'복사했어요 ✓':'복사하지 못했어요';clearTimeout(btn._t);btn._t=setTimeout(()=>btn.textContent=label,1600);
  };
  const download=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  document.addEventListener('click',e=>{
    const b=e.target.closest('.tp-act,.dt-prompt');if(!b)return;
    if(b.classList.contains('dt-prompt'))return copyText(promptFor(cur),b);
    const act=b.dataset.act;
    if(act==='md'){download('DESIGN.md',designMd());const label=b.dataset.label||(b.dataset.label=b.textContent);b.textContent='내려받았어요 ✓';clearTimeout(b._t);b._t=setTimeout(()=>b.textContent=label,1600)}
    if(act==='hex'){const{p}=resolved();copyText(hexText(p,`UI GuideBook 팔레트 — ${p.name}`),b)}
  });

  // AI 팔레트: 원하는 느낌을 쓰면 Worker가 Claude로 만들고 명도 대비를 맞춰서 돌려줘요
  const aiForm=$('.ai-pal',tPanel),aiMsg=$('.tp-msg',tPanel);
  if(!AI_ENDPOINT)aiForm.hidden=true;
  aiForm.onsubmit=async e=>{
    e.preventDefault();
    const inp=$('input',aiForm),btn=$('button',aiForm),q=inp.value.trim();
    if(!q)return inp.focus();
    btn.disabled=true;aiMsg.textContent='팔레트를 만들고 있어요…';
    try{
      const res=await fetch(AI_ENDPOINT.replace(/\/$/,'')+'/palette',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:q})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'팔레트를 만들지 못했어요.');
      const p={...data.palette,id:'ai-'+(++aiSeq),ai:true};
      aiPals.push(p);theme.pal=p.id;applyTheme();drawAll();inp.value='';
      aiMsg.textContent=`"${p.name}" 팔레트를 적용했어요.`+(data.adjusted?.length?' 글자가 잘 보이도록 일부 색을 보정했어요.':'');
    }catch(err){aiMsg.textContent=err instanceof TypeError?'AI 서버에 연결하지 못했어요.':err.message}
    finally{btn.disabled=false}
  };
  applyTheme();

  // AI 검색: 버튼이나 Enter를 누를 때만 Worker에 물어봐요 (글자 검색은 위의 filter가 그대로 처리)
  const aiBtn=$('#ai'),panel=$('#ai-panel'),SRC_LABEL={'ui-glossary':'UI 용어 사전'};
  const GLOSSARY='UI/ui-glossary.html#';
  if(AI_ENDPOINT){
    aiBtn.hidden=false;
    $('#q').placeholder='용어 검색, 또는 질문 입력 후 Enter';
    $('#empty').textContent='일치하는 용어가 없어요. Enter를 누르면 AI가 질문 내용으로 찾아봐요.';
    const ask=async()=>{
      const q=$('#q').value.trim();
      if(!q)return $('#q').focus();
      panel.hidden=false;aiBtn.disabled=true;
      panel.innerHTML='<div class="ai-box"><p class="ai-load"><span class="spin"></span>자료를 찾고 있어요…</p></div>';
      try{
        const res=await fetch(AI_ENDPOINT.replace(/\/$/,'')+'/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q})});
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.error||'요청에 실패했어요.');
        panel.innerHTML=`<div class="ai-box"><div class="ai-head"><b>✦ AI 답변</b><button class="icon-btn ai-x" aria-label="AI 답변 닫기">${ic('close',16)}</button></div>
          <p class="ai-ans">${esc(data.answer)}</p>
          ${data.results.length?`<ul class="ai-res">${data.results.map(r=>`<li><button data-url="${esc(r.url)}"><span class="pill">${esc(SRC_LABEL[r.source]||r.url.split('/')[0])}</span><b>${esc(r.title)}</b><span class="muted">${esc(r.reason)}</span></button></li>`).join('')}</ul>`:''}
          <p class="ai-note">AI 답변은 틀릴 수 있어요. 항목을 눌러 원문을 확인하세요.</p></div>`;
      }catch(err){
        panel.innerHTML=`<div class="ai-box"><p class="ai-err">${esc(err instanceof TypeError?'AI 검색 서버에 연결하지 못했어요.':err.message)}</p></div>`;
      }finally{aiBtn.disabled=false}
    };
    aiBtn.onclick=ask;
    $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!['motion','anim'].includes(document.body.dataset.view))ask()});
    panel.addEventListener('click',e=>{
      if(e.target.closest('.ai-x')){panel.hidden=true;return}
      const url=e.target.closest('[data-url]')?.dataset.url;if(!url)return;
      // 용어 사전 항목은 상세 모달로, 다른 문서는 새 탭으로 (url은 '개발 체크리스트' 폴더 기준)
      if(url.startsWith(GLOSSARY))open(url.slice(GLOSSARY.length));else window.open('../'+url,'_blank','noopener');
    });
  }
})();
</script>
</body>
</html>
